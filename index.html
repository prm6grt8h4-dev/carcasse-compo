      </div>
    </div>
  </div>);
}

function ReceptionLingeView({userEmail,lingeItems}){
  const [dateConfirmed,setDateConfirmed]=useState(false);
  const [dateDraft,setDateDraft]=useState('');
  const [dateObj,setDateObj]=useState(null);
  const [vals,setVals]=useState(null);
  const [saving,setSaving]=useState(false);
  const [showArchive,setShowArchive]=useState(false);
  const [showExport,setShowExport]=useState(false);
  const [archive,setArchive]=useState([]);
  const [archiveLoading,setArchiveLoading]=useState(false);

  useEffect(()=>{
    const d=businessNow();
    setDateDraft(dateKey(d));setDateObj(d);
    setDateConfirmed(false);setVals(null);
  },[]);

  function buildVals(){
    const v={};
    lingeItems.blanchisseur.forEach(it=>{v[it.id]='';});
    lingeItems.elis.forEach(it=>{v[it.id]='';});
    return v;
  }

  function confirmDate(){
    if(!dateDraft)return;
    const d=new Date(dateDraft+'T12:00:00');
    if(isNaN(d.getTime()))return;
    setDateObj(d);setDateConfirmed(true);loadOrInit(d);
  }

  async function loadOrInit(d){
    const fb=getFirebase();if(!fb)return setVals(buildVals());
    const key=dateKey(d);
    try{
      const ref=fb.doc(fb.db,'linge_reception',key);
      const snap=await fb.getDoc(ref);
      if(snap.exists()&&snap.data().vals){setVals({...buildVals(),...snap.data().vals});}
      else{setVals(buildVals());}
    }catch(e){setVals(buildVals());}
  }

  function setCell(itemId,value){setVals(prev=>({...(prev||{}),[itemId]:value}));}

  async function saveToFirebase(){
    if(!vals||!dateObj)return;
    const fb=getFirebase();if(!fb)return;
    setSaving(true);
    const key=dateKey(dateObj);
    try{
      const ref=fb.doc(fb.db,'linge_reception',key);
      await fb.setDoc(ref,{date:key,dateDisplay:fmtDateFR(dateObj),vals,savedBy:userEmail,savedAt:new Date().toISOString()});
    }catch(e){console.error(e);}
    setSaving(false);
  }

  async function openArchive(){
    setShowArchive(true);setArchiveLoading(true);
    const fb=getFirebase();if(!fb){setArchiveLoading(false);return;}
    try{
      const col=fb.collection(fb.db,'linge_reception');
      const q=fb.query(col,fb.orderBy('date','desc'),fb.limit(200));
      const snap=await fb.getDocs(q);
      const items=[];snap.forEach(d=>items.push(d.data()));
      setArchive(items);
    }catch(e){console.error(e);}
    setArchiveLoading(false);
  }

  function groupByMonth(items){
    const m={};items.forEach(it=>{const k=it.date?it.date.slice(0,7):'';if(!m[k])m[k]=[];m[k].push(it);});
    return Object.entries(m).sort((a,b)=>b[0].localeCompare(a[0]));
  }

  const inputStyle={width:'100%',padding:'4px 2px',fontSize:13,fontWeight:600,border:'none',background:'transparent',textAlign:'center',outline:'none',color:'#1a1a1a'};
  const thStyle={fontSize:10,fontWeight:700,color:'#888',textTransform:'uppercase',letterSpacing:'.04em',padding:'6px 8px',textAlign:'center',borderBottom:'1px solid #e5e7eb'};

  return(<div style={{display:'flex',flexDirection:'column',gap:10}}>
    <div style={{display:'flex',gap:8,flexWrap:'wrap',alignItems:'center',padding:'8px 12px',background:'#ececea',borderRadius:8,border:'0.5px solid #d4d2c8'}}>
      <span style={{fontSize:13,fontWeight:500}}>Réception du linge</span>
      <div style={{flex:1}}/>
      <button onClick={openArchive} style={{padding:'6px 12px',fontSize:12,border:'0.5px solid #ccc',borderRadius:6,cursor:'pointer',background:'#fff',color:'#555'}}>Archive</button>
      {vals&&<button onClick={async()=>{await saveToFirebase();setShowExport(true);}} disabled={saving} style={{padding:'6px 12px',fontSize:12,fontWeight:600,border:'0.5px solid #86efac',borderRadius:6,cursor:'pointer',background:'#dcfce7',color:'#166534',opacity:saving?0.6:1}}>{saving?'Sauvegarde…':'Sauvegarder'}</button>}
    </div>

    {!dateConfirmed&&(<div style={{background:'#fff',borderRadius:10,padding:16,border:'0.5px solid #d4d2c8'}}>
      <div style={{fontSize:13,fontWeight:500,marginBottom:10}}>Date de la réception</div>
      <div style={{display:'flex',gap:8,alignItems:'center'}}>
        <input type="date" value={dateDraft} onChange={e=>setDateDraft(e.target.value)} style={{flex:1,padding:'9px 12px',fontSize:14,border:'0.5px solid #ccc',borderRadius:8,outline:'none'}}/>
        <button onClick={confirmDate} style={{padding:'9px 18px',fontSize:13,fontWeight:600,border:'0.5px solid #378ADD',borderRadius:8,cursor:'pointer',background:'#378ADD',color:'#fff'}}>Confirmer</button>
      </div>
    </div>)}

    {dateConfirmed&&vals&&(<div style={{background:'#fff',borderRadius:10,border:'0.5px solid #d4d2c8',overflow:'hidden'}}>
      <div style={{padding:'8px 12px',fontSize:12,color:'#666',borderBottom:'0.5px solid #eee',display:'flex',justifyContent:'space-between',alignItems:'center'}}>
        <span>{fmtDateFR(dateObj)}</span>
        <button onClick={()=>setDateConfirmed(false)} style={{fontSize:11,padding:'3px 8px',border:'0.5px solid #ccc',borderRadius:6,cursor:'pointer',background:'#fff',color:'#555'}}>Changer la date</button>
      </div>
      <table style={{width:'100%',borderCollapse:'collapse'}}>
        <thead>
          <tr>
            <th style={{...thStyle,textAlign:'left',width:'70%'}}>Article</th>
            <th style={thStyle}>Quantité</th>
          </tr>
        </thead>
        <tbody>
          <tr><td colSpan={2} style={{fontSize:10,fontWeight:700,textTransform:'uppercase',letterSpacing:'.06em',background:'#1a1a1a',color:'#fff',padding:'4px 8px'}}>Blanchisseur</td></tr>
          {lingeItems.blanchisseur.map((it,i)=>{const v=vals[it.id]||'';return(<tr key={it.id} style={{background:i%2===0?'#fff':'#fafaf9'}}>
            <td style={{fontSize:12,color:'#1a1a1a',padding:'4px 8px',borderBottom:'0.5px solid #f0efe9'}}>{it.label}</td>
            <td style={{borderBottom:'0.5px solid #f0efe9',borderLeft:'0.5px solid #f0efe9'}}><input value={v} onChange={e=>setCell(it.id,e.target.value)} onFocus={e=>e.target.select()} inputMode="numeric" style={inputStyle}/></td>
          </tr>);})}
          <tr><td colSpan={2} style={{fontSize:10,fontWeight:700,textTransform:'uppercase',letterSpacing:'.06em',background:'#1a1a1a',color:'#fff',padding:'4px 8px'}}>Elis</td></tr>
          {lingeItems.elis.map((it,i)=>{const v=vals[it.id]||'';return(<tr key={it.id} style={{background:i%2===0?'#fff':'#fafaf9'}}>
            <td style={{fontSize:12,color:'#1a1a1a',padding:'4px 8px',borderBottom:'0.5px solid #f0efe9'}}>{it.label}</td>
            <td style={{borderBottom:'0.5px solid #f0efe9',borderLeft:'0.5px solid #f0efe9'}}><input value={v} onChange={e=>setCell(it.id,e.target.value)} onFocus={e=>e.target.select()} inputMode="numeric" style={inputStyle}/></td>
          </tr>);})}
        </tbody>
      </table>
    </div>)}

    {showArchive&&(<div onClick={e=>{if(e.target===e.currentTarget)setShowArchive(false);}} style={{position:'fixed',inset:0,background:'rgba(0,0,0,.4)',display:'flex',alignItems:'center',justifyContent:'center',zIndex:200}}>
      <div style={{background:'#f5f4f0',borderRadius:12,padding:20,width:360,maxHeight:'80vh',overflowY:'auto',border:'0.5px solid #ddd'}}>
        <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:14}}>
          <span style={{fontWeight:700,fontSize:14}}>Archive réception</span>
          <button onClick={()=>setShowArchive(false)} style={{background:'none',border:'none',fontSize:20,cursor:'pointer',color:'#888'}}>×</button>
        </div>
        {archiveLoading&&<div style={{textAlign:'center',color:'#aaa',fontSize:13,padding:'20px 0'}}>Chargement…</div>}
        {!archiveLoading&&archive.length===0&&<div style={{textAlign:'center',color:'#aaa',fontSize:13,padding:'20px 0'}}>Aucune entrée.</div>}
        {!archiveLoading&&groupByMonth(archive).map(([month,items])=>{
          const [y,m]=month.split('-');
          const monthLabel=new Date(parseInt(y),parseInt(m)-1,1).toLocaleDateString('fr-FR',{month:'long',year:'numeric'});
          return(<AccordionMonth key={month} monthLabel={monthLabel}>
            {items.map(it=>{
              const parts=(it.dateDisplay||'').split('/');
              const fullDate=parts.length===3?new Date(parseInt(parts[2]),parseInt(parts[1])-1,parseInt(parts[0])).toLocaleDateString('fr-FR',{weekday:'long',day:'numeric',month:'long',year:'numeric'}):(it.dateDisplay||'');
              return(<div key={it.date} style={{background:'#fff',borderRadius:8,padding:'8px 12px',marginBottom:4,border:'0.5px solid #e5e7eb',display:'flex',alignItems:'center',justifyContent:'space-between'}}>
              <div style={{fontSize:12,fontWeight:600,color:'#1a1a1a',textTransform:'capitalize'}}>{fullDate}</div>
              <div style={{display:'flex',gap:6,alignItems:'center'}}>
                <button onClick={()=>{setShowArchive(false);setVals({...buildVals(),...(it.vals||{})});const parts2=(it.dateDisplay||'').split('/');if(parts2.length===3)setDateObj(new Date(parseInt(parts2[2]),parseInt(parts2[1])-1,parseInt(parts2[0])));setDateConfirmed(true);setShowExport(true);}} style={{fontSize:11,padding:'3px 10px',border:'0.5px solid #86efac',borderRadius:6,cursor:'pointer',background:'#dcfce7',color:'#166534'}}>Voir</button>
                {!isLinge(userEmail)&&<button onClick={async()=>{const fb=getFirebase();if(!fb)return;try{await fb.deleteDoc(fb.doc(fb.db,'linge_reception',it.date));setArchive(prev=>prev.filter(x=>x.date!==it.date));}catch(e){console.error(e);}}} style={{fontSize:16,padding:'2px 8px',border:'none',borderRadius:4,cursor:'pointer',background:'#fee2e2',color:'#991b1b',lineHeight:1}}>×</button>}
              </div>
            </div>);})}
          </AccordionMonth>);
        })}
      </div>
    </div>)}

    {showExport&&vals&&<ReceptionExport onClose={()=>setShowExport(false)} dateStr={fmtDateFR(dateObj)} vals={vals} lingeItems={lingeItems}/>}

const CHEESE_SEED_DATA=[{"id": "abbaye-de-tamie", "nom": "Abbaye de Tamié", "lait": "Vache", "pate": "Pâte molle à croûte lavée", "dept": "73", "terroir": "Abbaye près d'Albertville, Savoie", "producteur": "Abbaye de Tamié", "aoc": "", "poids": "", "production": "2 à 4 mois", "description": "L’Abbaye trappiste fondée en 1131 fabrique son fromage frappé de la croix de l’Ordre de Malte.\n\nL’histoire de certains fromages s’est écrit sur des siècles, les ordres monastiques ont permis grâce aux moines érudits de faire perdurer des traditions ancestrales que nous pouvons toujours apprécier à notre époque.\n\nNichée au col de Tamié dans le massif alpin des Bauges, l’Abbaye trappiste fondée en 1131 fabrique son fromage frappé de la croix de l’Ordre de Malte, dont l’empreinte rend chaque pièce encore plus belle.\n\nProche du terroir du Reblochon, le Tamié semble s’en inspirer, la forme et la taille sont similaires, mais ce dernier est souvent d’un format plus régulier. La croûte part d’un gris clair vers des tons plus orangés lors de son affinage, couleur qui s’affirme encore plus au brossage. La pâte d’un beurre pâle est généreuse et présente quelques ouvertures discrètes. Les effluves sont légers, notes lactiques et champignons frais essentiellement. La dégustation permet d’apprécier un fromage doux, fin et élégant, rarement dans l’excès sauf garde en cave très longue. Une crème légèrement acide souligne les arômes.\nLes fromages de frère Nathanaël chantent depuis longtemps leurs homélies dans nos caves."}, {"id": "le-petit-fuxeen", "nom": "Le petit fuxéen", "lait": "Vache", "pate": "Molle, croûte lavée", "dept": "09", "terroir": "Pyrénées ariégeoises", "producteur": "Famille Garros", "aoc": "", "poids": "", "production": "", "description": "Le Petit Fuxéen ne ressemble pas à un fromage classique des Pyrénées, avec sa croûte d’un rouge effacé et son duvet blanc\n\nDans le massif des Pyrénées, au fond d’une vallée de l’Ariège, s’est créée il y a plus de trente ans la célèbre fromagerie de Cabrioulet.\nMarie-Suzanne et Philippe Garros y ont développés des fromages sans pareils, empreints d’une identité remarquable. Ils y produisent leur lait de chèvre, et le transforment en pépites dont certaines sont devenues emblématiques comme le Petit Fiancé. Ils ont créé depuis peu son cousin au lait de vache dont le nom provient de la ville de Foix toute proche.\nLe Petit Fuxéen ne ressemble pas à un fromage classique des Pyrénées, avec sa croûte d’un rouge effacé et son duvet blanc, on dirait plutôt un petit Munster. La pâte est d’un beau jaune qui dénote son origine bovine. Au nez les effluves de cette dernière sont bien présents, comme en bouche, ou il se distingue comme une spécialité des plus racés, notamment quand l’affinage a fait son œuvre."}, {"id": "linthalois", "nom": "Linthalois", "lait": "Lait cru de chèvre", "pate": "Molle, croûte crémeuse et fondante", "dept": "68", "terroir": "Ferme des Pensées Sauvages, Linthal, Alsace", "producteur": "Famille Baumann", "aoc": "", "poids": "", "production": "", "description": "L’Alsace, bien que moins réputée que d’autres régions pour sa tradition fromagère, recèle pourtant des pépites artisanales, notamment dans le massif vosgien. Parmi elles, le Linthalois – ou Petit Sauvage – se distingue comme une création audacieuse et inspirée.\n\nNé à la ferme des Pensées Sauvages à Linthal, ce fromage est l’œuvre de la famille Baumann, producteurs engagés de Munster et de Bargkass, et pionniers de la biodynamie en Alsace. Leur démarche, résolument tournée vers une agriculture raisonnée et respectueuse, s’incarne aussi dans leur production fromagère. L’un de leurs fils, après avoir acquis un petit troupeau de chèvres, s’est lancé dans la fabrication de fromages, dont ce petit lactique en forme de palet d’un blanc éclatant.\n\nLe Linthalois se reconnaît à sa pâte d’abord dense, qui s’adoucit avec l’affinage pour offrir une texture crémeuse et fondante. Ce qui le rend unique, c’est sa touche caprine bien marquée, qu’il soit jeune ou affiné, ainsi qu’une identité aromatique affirmée, loin des profils standardisés que l’on retrouve trop souvent chez les fromages de chèvre."}, {"id": "banditu", "nom": "Banditu", "lait": "Brebis", "pate": "Molle à croûte lavée", "dept": "2B", "terroir": "Corse", "producteur": "Famille Baldovini", "aoc": "", "poids": "300g", "production": "45 à 90 jours", "description": "Producteur de ce beau fromage traditionnel Corse, M. Baldovini est installé dans la fromagerie familiale située entre Corte et Aléria sur la côte orientale de l’île.\nFromage à pâte ferme de forme ronde d’environ 300 g au lait cru, caillé présure, moulage en faisselles traditionnelles et accouplée deux à deux, salage à sec à la main, croûte lavée de couleur naturelle orangée, puis fleurie en vieillissant, affinage 45 à 90 jours.\n\nC’est un fromage qui fleure bon le maquis, surtout lorsqu’il est jeune avec une pâte encore souple. Plus affinée sa pâte devient friable, il exprime une note plus saline."}, {"id": "beaufort", "nom": "Beaufort", "lait": "Vache", "pate": "Pressée cuite, croûte naturelle morgée", "dept": "73", "terroir": "Vallée de la Tarentaise, Savoie", "producteur": "Famille Perret", "aoc": "1968", "poids": "20 à 70kg (moyenne ~40kg)", "production": "Estive 2020", "description": "Surnommé le prince des gruyères, il est un emblème des fromages d’estive.\n\nD’une notoriété sans pareille, bien que souvent confondu avec ses cousins moins prestigieux, produit en altitude à la belle saison au cœur des Alpes, il est un emblème des fromages d’estive, surnommé le prince des gruyères.\n\nCette pâte pressée cuite, tire son prestige du faible nombre de producteurs, et de son appellation chalet d’alpage qui impose la production à au moins 1500 mètres d’altitude, transformée directement après la traite du matin et du soir avec le lait d’un seul troupeau. Ces conditions particulières permettent l’élaboration d’un fromage rare et unique.\n\nGrosse meule de 40 à 50 kg, au talon e par de longues failles appelées « fleurines ». Ce mécanisme favorise la dispersion du pénicillium roqueforti nécessaire au développement des veinures bleues. La nature y maintient ainsi des conditions biologiques uniques au monde.\nConnue pour être le plus petit fabricant de la filière avec son Roquefort « Vieux Berger », la fromagerie Combes a été fondé en 1923. Elle est dirigée par Vincent Combes qui représente la 3ième génération. Grâce à cette famille il est encore possible de goûter un roquefort véritablement artisanal, moins de 1% de la production de l’appellation.\nLe Roquefort de la famille Combes, se distingue par un persillage léger et clair, d’un vert effacé et bleu pastel, bien que l’affinage accentue parfois ces tons qui s’harmonisent au sein d’une pâte blanche ivoire, parfois ponctué de notes beiges. C’est un fromage fondant en bouche, doté d’une belle salinité, la longueur et la complexité ont peu d’équivalents. La noix est souvent présente en bouche, équilibré par la légère acidité de la brebis."}, {"id": "saint-nectaire", "nom": "Saint Nectaire", "lait": "Vache", "pate": "Pressée non cuite, croûte fleurie", "dept": "63", "terroir": "Clermont-Ferrand, Puy-de-Dôme", "producteur": "Fromagerie Nivesse", "aoc": "1965", "poids": "1,7kg", "production": "2 mois d'affinage", "description": "L’Auvergne est la région la plus pourvue en AOP fromagères, label plébiscité par les consommateurs, mais qui ne garantit cependant pas toujours l’artisanat d’un produit, car productions industrielles et fermières partagent parfois le même nom.\nUn Saint-Nectaire digne de ce nom doit présenter un aspect sauvage, recouvert de Mucor qui se dresse en duvet gris cendre. Essuyé et ressuyé, il finit par laisser place à une croûte irrégulière qui sent la paille humide et le cellier. La pâte beige clair présente de rares ouvertures et déborde souvent en généreuse crème. En bouche s’illustrent des notes de sous-bois, de champignons et d’humus. Toutes ces touches terreuses rendent , "aoc": "", "poids": "600g", "production": "6 à 8 semaines d'affinage", "description": "Une création assez récente, qui s’inspire de l’ancienne tradition des vacherins savoyards cerclés d’épicéa pour contenir leurs généreuses pâtes.\n\nLe fromage tire son nom du village de Manigod où il vit le jour, façonné dans une ferme des Aravis, et où la famille Paccard, talentueux affineurs nous ont fait découvrir ce formidable fromage.\n\nRond et ceinturé de son beau bois, la Manigodine arbore une croûte d’un rouge effacé duvetée d’une petite fleur blanche. A force de soins humides, cette dernière va s’effacer pour laisser place à une robe plus foncée. Il faut savoir attendre, car le fromage exhale même jeune un parfum de foin et de boisé qui invite à la dégustation."}, {"id": "fromages-de-chevre-de-peymeinade", "nom": "Fromages de chèvre de Peymeinade", "lait": "Chèvre", "pate": "Frais à sec (frais, petit affiné/crémeux, gros affiné/demi-sec, cendré, sec)", "dept": "06", "terroir": "Peymeinade, Alpes-Maritimes", "producteur": "Famille Monteiro", "aoc": "", "poids": "", "production": "Fermière", "description": "Gamme de plusieurs affinages produite par la famille Monteiro."}, {"id": "munster", "nom": "Munster", "lait": "Vache", "pate": "Molle, croûte lavée", "dept": "88", "terroir": "Val-d'Ajol, Vosges", "producteur": "Étienne et Madeleine Petitjean", "aoc": "1969", "poids": "0,45kg", "production": "Fermière", "description": "Sur le versant ouest du massif, la famille Petit-Jean fabrique quant à elle ses fromages dans le Val d’Ajol. Elle y produit un Munster fermier dont la croûte orangée voire jaune, grasse et morgée, cache une pâte ivoire généreuse et crémeuse. Le nez est animal, mais la bouche est étonnamment douce, un beau gras domine et accompagne de discrètes notes liquoreuses sur une belle longueur. Leur Munster est souvent plus fin et moins rustique."}, {"id": "lelutcha-des-cabasses", "nom": "L’Elŭtcha des Cabasses", "lait": "Brebis", "pate": "Pressée cuite, croûte l . Il se déguste aussi bien crémeux lorsqu’il est jeune, que plus friable lorsqu’il s’affine et possède alors une belle minéralité."}, {"id": "tomme-de-brebis-d-estive-ferme-tilous-bergez", "nom": "Tomme de brebis d'estive (Ferme Tilous Bergez)", "lait": "Brebis", "pate": "Pressée non cuite, croûte naturelle morgée", "dept": "64", "terroir": "La Pierre Saint-Martin, Pyrénées-Atlantiques", "producteur": "Ferme Tilous Bergez", "aoc": "AOP Ossau-Iraty", "poids": "", "production": "Fermière", "description": "Lait de brebis basco-béarnaises collecté pendant la transhumance estivale. La ferme a obtenu plusieurs médailles nationales."}, {"id": "tomme-de-brebis-d-estive-maina-chassevent", "nom": "Tomme de Brebis d'Estive (Maina Chassevent)", "lait": "Brebis", "pate": "Pressée non cuite, croûte naturelle morgée", "dept": "64", "terroir": "Saint-Jean-Pied-de-Port, Pyrénées-Atlantiques", "producteur": "Maina Chassevent", "aoc": "", "poids": "", "production": "Fermière", "description": "Maina Chassevent s’installe bergère sans terre, et conduit un troupeau de 150 brebis basco-béarnaises. Elle traie les brebis et fabrique le fromage à la main.\n\nEn 2020, elle s’installe sur la ferme Jaikoborda prenant la suite de Claude Kratochvil sur les terres d’Aincille."}, {"id": "brousse-du-rove", "nom": "Brousse du Rove", "lait": "Chèvre frais", "pate": "Sans croûte ni pâte (fromage frais)", "dept": "13", "terroir": "Meyreuil, Provence", "producteur": "Gaec Lou Miss, Laurence Chaulier", "aoc": "AOP 2018 / AOP 2020", "poids": "", "production": "En mars, sur 6 mois", "description": "Produit à partir de chèvres du Rove (cornes torsadées) nourries exclusivement au pâturage, conformément au cahier des charges de l'AOP."}, {"id": "igai-txipia", "nom": "Igaï Txipia", "lait": "Brebis", "pate": "Molle, croûte lavée", "dept": "64", "terroir": "Menditte, Pays Basque, Sud-Ouest", "producteur": "Ferme Igaya (Hélène Sallefranque et Émilie Koehl)", "aoc": "Pas d'AOP (par choix)", "poids": "", "production": "3 mois minimum", "description": "La ferme Igaya est une ancienne exploitation tenue depuis 4 générations en Soule, si le lait des brebis était pour l’essentiel vendu aux laiteries jusqu’à maintenant, HélèneSallefranque s’est depuis peu mise à la fabrication de fromages. Elle s’est associée dans ce but avec Emilie Koehl, d’origine alsacienne, les deux femmes misant sur les pratiques vertueuses et la qualité avant tout. Un choix heureux, puisque la réussite et le succès ont suivi.\n\nL'Igaï Txipia est un brebis à croûte lavée, comme un Munster, avec un parfum intense voire musqué. Sous une croûte lisse orangée et duvetée de blanc, la pâte ivoire est souple puis devient crémeuse avec un affinage en cave chaude et humide. Son goût développe des notes terreuses, mais la finesse du lait de brebis les tempère en lui conférant de fines touches fruitées et lactiques."}, {"id": "arbori", "nom": "Arbori", "lait": "Chèvre", "pate": "Molle, croûte lavée", "dept": "2A", "terroir": "Sud de la Corse / Arbori", "producteur": "Johanna Soton / Fromagerie Fiore di Latte", "aoc": "", "poids": "", "production": "Fermière", "description": "Quintessence du produit fermier, rare et méconnu, l’Arbori n’est jamais le même, tantôt souple, parfois ferme, voire dur, il possède néanmoins toujours la force et la vigueur de sa terre natale. Un tel fromage ne laisse jamais indifférent, que ce soit par sa croûte rouge clair nervurée, son parfum musqué, son goût affirmé adouci par une touche caprine qui tempère sa force de caractère. Un grand fromage a l’identité affirmée."}, {"id": "tomette-corse-mutagna", "nom": "Tomette corse Mutagna", "lait": "Brebis cru", "pate": "Molle, croûte lavée", "dept": "2A", "terroir": "Sud-ouest de la Corse / Arbori", "producteur": "Xavier Baldovini / Fromagerie Fiore di Latte", "aoc": "", "poids": "", "production": "Fermière (affinage 45 à 90 jours)", "description": "Texture blanche légèrement granuleuse ; croûte orangée développant arômes de noisette, notes cuivrées, légère salinité. Ferme : 2 générations, 70 ans d'expérience, 700 brebis, 1000L de lait."}];


function ZoomableMap({children}){
  // Zoom/pan tactile maison : en mode webapp installée (standalone iOS), le pincement natif du

  const [scale,setScale]=useState(1);
  const [tx,setTx]=useState(0);

  const pinchRef=useRef({active:false,startDist:0,startScale:1});
  const panRef=useRef({active:false,startX:0,startY:0,startTx:0,startTy:0});

  function dist(a,b){const dx=b.clientX-a.clientX,dy=b.clientY-a.clientY;return Math.sqrt(dx*dx+dy*dy);}

  function onTouchStart(e){
    if(e.touches.length===2){
      e.preventDefault();

function CarteFromageView({userEmail}){
  const [cheeses,setCheeses]=useState([]);
  const [loading,setLoading]=useState(true);
  const [selected,setSelected]=useState(null);
  const [highlighted,setHighlighted]=useState(null);
  const [showAllLabels,setShowAllLabels]=useState(true);
  const [importing,setImporting]=useState(false);
  const [importError,setImportError]=useState('');
  const [showAdd,setShowAdd]=useState(false);
  const [showList,setShowList]=useState(false); // repliée par défaut, se déroule au clic sur "Liste des fromages"
  const blankForm={nom:'',lait:'',pate:'',dept:'',terroir:'',producteur:'',aoc:'',poids:'',production:'',description:''};
  const [form,setForm]=useState(blankForm);
  const [saving,setSaving]=useState(false);
  const [editingId,setEditingId]=useState(null); // null = ajout ; sinon id de la fiche en cours de modification

  function openEdit(c){
    setEditingId(c.id);
    setForm({nom:c.nom||'',lait:c.lait||'',pate:c.pate||'',dept:c.dept||'',terroir:c.terroir||'',producteur:c.producteur||'',aoc:c.aoc||'',poids:c.poids||'',production:c.production||'',description:c.description||''});
    setShowAdd(true);
  }
  function closeForm(){setShowAdd(false);setForm(blankForm);setEditingId(null);}

  async function addCheese(){
    if(!form.nom.trim()||!form.dept)return;
    setSaving(true);
    const fb=getFirebase();
    if(fb){
      const id=editingId||(form.nom.trim().toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,'')+'-'+Date.now());
      try{
        const newCheese={...form,id,terroir:form.terroir||DEPT_NAMES[form.dept]};
        await fb.setDoc(fb.doc(fb.db,'fromage_carte',id),newCheese);
        closeForm();
        await loadCheeses();
      }catch(e){console.error(e);}
    }
    setSaving(false);
  }

  async function loadCheeses(){
    const fb=getFirebase();if(!fb)return;
    setLoading(true);
    try{
      const snap=await fb.getDocs(fb.collection(fb.db,'fromage_carte'));
      const items=[];snap.forEach(d=>items.push({...d.data(),id:d.id}));
      items.sort((a,b)=>a.nom.localeCompare(b.nom));
      setCheeses(items);
    }catch(e){console.error(e);}
    setLoading(false);
  }
  useEffect(()=>{loadCheeses();},[]);

  async function importSeed(replaceExisting){
    if(replaceExisting&&!window.confirm('Ça va supprimer les '+cheeses.length+' fiches actuelles et les remplacer par les '+CHEESE_SEED_DATA.length+' fiches à jour. Continuer ?'))return;
    setImporting(true);setImportError('');
    try{
      const fb=getFirebase();if(!fb)throw new Error('Connexion Firebase indisponible.');
      if(replaceExisting){
        for(const c of cheeses){await fb.deleteDoc(fb.doc(fb.db,'fromage_carte',c.id));}
      }
      for(const c of CHEESE_SEED_DATA){
        await fb.setDoc(fb.doc(fb.db,'fromage_carte',c.id),c);
      }
      await loadCheeses();
    }catch(e){console.error('Import échoué :',e);setImportError(e.message||'Erreur inconnue pendant l\'import.');}
    setImporting(false);
  }

  async function deleteCheese(id){
    const fb=getFirebase();if(!fb)return;
    try{
      await fb.deleteDoc(fb.doc(fb.db,'fromage_carte',id));
      setCheeses(prev=>prev.filter(c=>c.id!==id));
      if(highlighted===id)setHighlighted(null);
    }catch(e){console.error(e);}
  }

  function selectCheese(c){
    setHighlighted(c.id);
    setSelected(c);
  }

  const grouped={};
  cheeses.forEach(c=>{if(!grouped[c.dept])grouped[c.dept]=[];grouped[c.dept].push(c);});

  // Empilement vertical par département (à gauche ou à droite du point selon la position sur la carte,
  // pour pousser les étiquettes vers l'espace libre plutôt que vers le centre) comme point de départ,
  // puis une passe de résolution de collisions GLOBALE (toutes les étiquettes entre elles, pas
  // seulement au sein d'un même département) qui écarte deux boîtes dès qu'elles se touchent, même
  // si elles viennent de départements voisins. Garantit qu'aucune bulle ne touche jamais une autre.
  const layout={};
  Object.keys(grouped).forEach(dept=>{
    const coord=DEPT_COORDS[dept];if(!coord)return;
    const list=grouped[dept];
    const side=coord[0]<385?'left':'right';
    const n=list.length;
    list.forEach((c,i)=>{
      const fanAngle=n>1?(i-(n-1)/2)*0.5:0;
      const ox=coord[0]+Math.cos(fanAngle)*Math.min(n-1,3)*4;
      const oy=coord[1]+Math.sin(fanAngle)*Math.min(n-1,3)*4;
      const ly=coord[1]-((n-1)*8)+i*16;
      const boxW=Math.min(150,Math.max(55,c.nom.length*5.3));
      const lx=side==='right'?coord[0]+42+boxW/2:coord[0]-42-boxW/2;
      layout[c.id]={ox,oy,lx:Math.max(105+boxW/2,Math.min(665-boxW/2,lx)),ly:Math.max(16,Math.min(592,ly)),boxW};
    });
  });
  const BOX_H=17,PAD=3; // hauteur de chaque bulle + marge minimale à conserver entre deux bulles
  const layoutIds=Object.keys(layout);
  for(let iter=0;iter<60;iter++){
    let moved=false;
    for(let i=0;i<layoutIds.length;i++){
      for(let j=i+1;j<layoutIds.length;j++){
        const a=layout[layoutIds[i]],b=layout[layoutIds[j]];
        const ax1=a.lx-a.boxW/2-PAD,ax2=a.lx+a.boxW/2+PAD,ay1=a.ly-BOX_H/2-PAD,ay2=a.ly+BOX_H/2+PAD;
        const bx1=b.lx-b.boxW/2-PAD,bx2=b.lx+b.boxW/2+PAD,by1=b.ly-BOX_H/2-PAD,by2=b.ly+BOX_H/2+PAD;
        const overlapX=Math.min(ax2,bx2)-Math.max(ax1,bx1);
        const overlapY=Math.min(ay2,by2)-Math.max(ay1,by1);
        if(overlapX>0&&overlapY>0){
          moved=true;
          if(overlapX<overlapY){
            const push=overlapX/2+0.4;
            if(a.lx<b.lx){a.lx-=push;b.lx+=push;}else{a.lx+=push;b.lx-=push;}
          }else{
            const push=overlapY/2+0.4;
            if(a.ly<b.ly){a.ly-=push;b.ly+=push;}else{a.ly+=push;b.ly-=push;}
          }
        }
      }
    }
    if(!moved)break;
  }
  layoutIds.forEach(id=>{
    const p=layout[id];
    p.lx=Math.max(105+p.boxW/2,Math.min(665-p.boxW/2,p.lx));
    p.ly=Math.max(16,Math.min(592,p.ly));
  });

  return(<div style={{display:'flex',flexDirection:'column',gap:10}}>
    <div style={{display:'flex',justifyContent:'flex-end'}}>
      <button onClick={()=>setShowAllLabels(!showAllLabels)} style={{padding:'6px 12px',fontSize:12,fontWeight:500,border:'0.5px solid #ccc',borderRadius:6,background:showAllLabels?'#dbeafe':'#fff',color:showAllLabels?'#1e40af':'#555',cursor:'pointer'}}>{showAllLabels?'Masquer tous les fromages':'Afficher tous les fromages'}</button>
    </div>
    <div style={{background:'#fff',borderRadius:10,border:'0.5px solid #d4d2c8',overflow:'hidden'}}>
      <ZoomableMap><FranceOutlineSVG>
        {cheeses.map(c=>{
          const p=layout[c.id];if(!p)return null;
          const isH=highlighted===c.id;
          return <circle key={c.id} cx={p.ox} cy={p.oy} r={isH?6:4} fill={isH?'#D85A30':'#378ADD'} stroke="#fff" strokeWidth="1" style={{cursor:'pointer'}} onClick={()=>selectCheese(c)}/>;
        })}
        {cheeses.map(c=>{
          if(!showAllLabels&&highlighted!==c.id)return null;
          const p=layout[c.id];if(!p)return null;
          const isH=highlighted===c.id;
          return(<g key={'lbl'+c.id}>
            <path d={'M'+p.ox+','+p.oy+' L'+p.lx+','+p.ly} stroke="#888780" strokeWidth={isH?1.4:0.6} fill="none" opacity={isH?1:0.55}/>
            <rect x={p.lx-p.boxW/2} y={p.ly-8} width={p.boxW} height={16} rx="4" fill={isH?'#eef4fc':'#fff'} stroke={isH?'#185FA5':'#ccc'} strokeWidth={isH?1:0.5} opacity="0.95"/>
            <text x={p.lx} y={p.ly+3.5} fontSize="7.5" fontWeight={isH?700:500} fill="#185FA5" fontFamily="sans-serif" textAnchor="middle" style={{cursor:'pointer'}} onClick={()=>selectCheese(c)}>{c.nom}</text>
          </g>);
        })}
      </FranceOutlineSVG></ZoomableMap>
    </div>


    {loading&&<div style={{textAlign:'center',color:'#aaa',fontSize:13,padding:'12px 0'}}>Chargement…</div>}

    {!loading&&cheeses.length===0&&(
      <div style={{background:'#fff',borderRadius:10,border:'0.5px solid #d4d2c8',padding:20,textAlign:'center'}}>
        <div style={{fontSize:13,color:'#666',marginBottom:12}}>Aucune fiche fromage enregistrée.</div>
        <button onClick={()=>importSeed(false)} disabled={importing} style={{padding:'9px 18px',fontSize:13,fontWeight:600,border:'none',borderRadius:8,background:'#378ADD',color:'#fff',cursor:'pointer',opacity:importing?0.6:1}}>{importing?'Import en cours…':'Importer les 38 fiches'}</button>
        {importError&&<div style={{marginTop:10,fontSize:12,color:'#991b1b',background:'#fee2e2',borderRadius:6,padding:'8px 10px'}}>{importError}</div>}
      </div>
    )}

    <div style={{display:'flex',justifyContent:'center'}}>
      <button onClick={()=>setShowList(!showList)} style={{padding:'7px 16px',fontSize:12,fontWeight:700,border:'none',borderRadius:8,background:'#378ADD',color:'#fff',cursor:'pointer'}}>{showList?'▲ ':'▼ '}Liste des fromages</button>
    </div>

    {showList&&(<>
    {!loading&&!isLinge(userEmail)&&(
      <button onClick={()=>setShowAdd(true)} style={{padding:'9px 0',fontSize:13,fontWeight:600,border:'none',borderRadius:8,background:'#378ADD',color:'#fff',cursor:'pointer'}}>+ Ajouter un fromage</button>
    )}

    {!loading&&cheeses.length>0&&(
      <div style={{background:'#fff',borderRadius:10,border:'0.5px solid #d4d2c8',overflow:'hidden'}}>
        {cheeses.map((c,i)=>(
          <div key={c.id} style={{display:'flex',alignItems:'center',justifyContent:'space-between',padding:'10px 14px',background:highlighted===c.id?'#eef4fc':(i%2===0?'#fff':'#fafaf9'),borderBottom:'0.5px solid #f0efe9'}}>
            <button onClick={()=>selectCheese(c)} style={{background:'none',border:'none',padding:0,fontSize:13,fontWeight:500,color:'#185FA5',cursor:'pointer',textAlign:'left',flex:1}}>{c.nom}</button>
            {!isLinge(userEmail)&&<div style={{display:'flex',gap:6}}>
              <button onClick={()=>openEdit(c)} style={{fontSize:11,padding:'4px 9px',border:'0.5px solid #93c5fd',borderRadius:6,cursor:'pointer',background:'#dbeafe',color:'#1e40af',fontWeight:500}}>Modifier</button>
              <button onClick={()=>{if(window.confirm('Supprimer '+c.nom+' ?'))deleteCheese(c.id);}} style={{fontSize:15,padding:'2px 9px',border:'none',borderRadius:4,cursor:'pointer',background:'#fee2e2',color:'#991b1b',lineHeight:1}}>×</button>
            </div>}
          </div>
        ))}
      </div>
    )}
    </>)}

    {showAdd&&(<div style={{position:'fixed',inset:0,background:'rgba(0,0,0,.5)',display:'flex',alignItems:'stretch',justifyContent:'center',zIndex:300}}>
      <div style={{background:'#f5f4f0',padding:20,width:'100%',maxWidth:600,height:'100%',overflowY:'auto',border:'0.5px solid #ddd',boxSizing:'border-box'}}>
        <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:14}}>
          <span style={{fontWeight:700,fontSize:15}}>{editingId?'Modifier '+form.nom:'Ajouter un fromage'}</span>
          <button onClick={closeForm} style={{background:'none',border:'none',fontSize:22,cursor:'pointer',color:'#888'}}>×</button>
        </div>
        <div style={{display:'flex',flexDirection:'column',gap:8}}>

          <input placeholder="Producteur" value={form.producteur} onChange={e=>setForm({...form,producteur:e.target.value})} style={{padding:'9px 10px',fontSize:13,border:'0.5px solid #ccc',borderRadius:8}}/>
          <input placeholder="AOP (année ou vide)" value={form.aoc} onChange={e=>setForm({...form,aoc:e.target.value})} style={{padding:'9px 10px',fontSize:13,border:'0.5px solid #ccc',borderRadius:8}}/>
          <input placeholder="Poids" value={form.poids} onChange={e=>setForm({...form,poids:e.target.value})} style={{padding:'9px 10px',fontSize:13,border:'0.5px solid #ccc',borderRadius:8}}/>
          <input placeholder="Affinage / production" value={form.production} onChange={e=>setForm({...form,production:e.target.value})} style={{padding:'9px 10px',fontSize:13,border:'0.5px solid #ccc',borderRadius:8}}/>

function FromageView({currentService,services,userEmail,fromageList,setFromageList,saveFromageList}){
  const svcLabel=services.find(s=>s.id===currentService)?.label??'';

  const [dateConfirmed,setDateConfirmed]=useState(false);
  const [dateDraft,setDateDraft]=useState('');
  const [dateObj,setDateObj]=useState(null);
  const [vals,setVals]=useState(null);
  const [saving,setSaving]=useState(false);
  const [saved,setSaved]=useState(false);
  const [showArchive,setShowArchive]=useState(false);
  const [showExport,setShowExport]=useState(false);
  const [archive,setArchive]=useState([]);
  const [archiveLoading,setArchiveLoading]=useState(false);
  const [showManage,setShowManage]=useState(false);
  const [newCheeseName,setNewCheeseName]=useState('');
  const [qtyMode,setQtyMode]=useState('numeric'); // 'numeric' (par défaut) ou 'text' (bascule via icône compacte)

  useEffect(()=>{
    const d=suggestDateForSvc(currentService);
    setDateDraft(dateKey(d));setDateObj(d);
    setDateConfirmed(false);setVals(null);
  },[currentService]);

  function buildVals(){
    const v={};
    fromageList.forEach(it=>{v[it.id]={lines:[emptyFromageLine()]};});
    return v;
  }

  function confirmDate(){
    if(!dateDraft)return;
    const d=new Date(dateDraft+'T12:00:00');
    if(isNaN(d.getTime()))return;
    setDateObj(d);setDateConfirmed(true);loadOrInit(d);
  }

  async function loadOrInit(d){
    const fb=getFirebase();if(!fb)return setVals(buildVals());
    const key=currentService+'_'+dateKey(d);
    try{
      const ref=fb.doc(fb.db,'fromage',key);
      const snap=await fb.getDoc(ref);
      if(snap.exists()&&snap.data().vals){
        const savedVals=snap.data().vals;
        const merged=buildVals();
        Object.keys(merged).forEach(id=>{merged[id]=normalizeFromageItemVal(savedVals[id]);});
        setVals(merged);
      } else{setVals(buildVals());}
    }catch(e){setVals(buildVals());}
  }

  function setLineField(itemId,lineIdx,field,value){
    setVals(prev=>{
      const item=prev[itemId]||{lines:[emptyFromageLine()]};
      const lines=item.lines.map((l,i)=>i===lineIdx?{...l,[field]:value}:l);
      return{...prev,[itemId]:{...item,lines}};
    });
    setSaved(false);
  }
  function addLine(itemId){
    setVals(prev=>{
      const item=prev[itemId]||{lines:[emptyFromageLine()]};
      return{...prev,[itemId]:{...item,lines:[...item.lines,emptyFromageLine()]}};
    });
    setSaved(false);
  }
  function removeLine(itemId,lineIdx){
    setVals(prev=>{
      const item=prev[itemId]||{lines:[emptyFromageLine()]};
      if(item.lines.length<=1)return prev;
      return{...prev,[itemId]:{...item,lines:item.lines.filter((_,i)=>i!==lineIdx)}};
    });
    setSaved(false);
  }

  async function saveToFirebase(){
    if(!vals||!dateObj)return;
    const fb=getFirebase();if(!fb)return;
    setSaving(true);
    const key=currentService+'_'+dateKey(dateObj);
    try{
      const ref=fb.doc(fb.db,'fromage',key);
      await fb.setDoc(ref,{svcId:currentService,svcLabel,date:dateKey(dateObj),dateDisplay:fmtDateFR(dateObj),vals,savedBy:userEmail,savedAt:new Date().toISOString()});
      setSaved(true);setTimeout(()=>setSaved(false),2000);
    }catch(e){console.error(e);}
    setSaving(false);
  }

  async function openArchive(){
    setShowArchive(true);setArchiveLoading(true);
    const fb=getFirebase();if(!fb){setArchiveLoading(false);return;}
    try{
      const col=fb.collection(fb.db,'fromage');
      const q=fb.query(col,fb.orderBy('date','desc'),fb.limit(200)); // ~1 an de services, au lieu de tout l'historique
      const snap=await fb.getDocs(q);
      const items=[];snap.forEach(d=>items.push(d.data()));
      setArchive(items); // déjà triées par la requête
    }catch(e){console.error(e);}
    setArchiveLoading(false);
  }

  function groupByMonth(items){
    const m={};items.forEach(it=>{const k=it.date?it.date.slice(0,7):'';if(!m[k])m[k]=[];m[k].push(it);});
    return Object.entries(m).sort((a,b)=>b[0].localeCompare(a[0]));
  }

  function addCheese(){
    const name=newCheeseName.trim();
    if(!name)return;
    const id=slugifyCheese(name);
    if(fromageList.some(it=>it.id===id))return;
    const updated=sortFromageList([...fromageList,{id,name}]);
    setFromageList(updated);saveFromageList(updated);
    setNewCheeseName('');

  function removeCheese(id){
    const updated=fromageList.filter(it=>it.id!==id);

      {vals&&<button onClick={async()=>{await saveToFirebase();setShowExport(true);}} disabled={saving} style={{padding:'6px 12px',fontSize:12,fontWeight:600,border:'0.5px solid #86efac',borderRadius:6,cursor:'pointer',background:'#dcfce7',color:'#166534',opacity:saving?0.6:1}}>{saving?'Sauvegarde…':'Sauvegarder'}</button>}
    </div>

    {!dateConfirmed&&(<div style={{background:'#fff',borderRadius:10,padding:16,border:'0.5px solid #d4d2c8'}}>

      <div style={{display:'flex',gap:8,alignItems:'center'}}>
        <input type="date" value={dateDraft} onChange={e=>setDateDraft(e.target.value)} style={{flex:1,padding:'9px 12px',fontSize:14,border:'0.5px solid #ccc',borderRadius:8,outline:'none'}}/>

    {dateConfirmed&&vals&&(<div style={{background:'#fff',borderRadius:10,border:'0.5px solid #d4d2c8',overflow:'hidden'}}>

          </tr>
        </thead>
        <tbody>
          {fromageList.map((it,i)=>{
            const itemVal=vals[it.id]||{lines:[emptyFromageLine()]};

            return lines.map((line,li)=>{
              const isPast=!!(line.dluo&&line.dluo<today);

                <td style={{borderBottom:rowSep,borderLeft:'0.5px solid #f0efe9'}}><input type="text" inputMode={qtyMode==='numeric'?'numeric':'text'} value={line.qty} onChange={e=>setLineField(it.id,li,'qty',e.target.value)} onFocus={e=>e.target.select()} style={inputStyle}/></td>
                <td style={{borderBottom:rowSep,borderLeft:'0.5px solid #f0efe9',padding:'2px 4px'}}>

// ─── Groupe ────────────────────────────────────────────────────────────────
const FR_MONTHS_NORM = ['janvier','fevrier','mars','avril','mai','juin','juillet','aout','septembre','octobre','novembre','decembre'];
function stripAccents(s){return s.normalize('NFD').replace(/[\u0300-\u036f]/g,'');}
function guessDateFromText(txt){
  const norm = stripAccents((txt||'').toLowerCase());
  const m = norm.match(/(\d{1,2})(?:\s*(?:er|eme|e))?\s+(janvier|fevrier|mars|avril|mai|juin|juillet|aout|septembre|octobre|novembre|decembre)/);
  if(!m) return dateKey(new Date());
  const day=parseInt(m[1]);
  const monthIdx=FR_MONTHS_NORM.indexOf(m[2]);
  if(monthIdx===-1) return dateKey(new Date());
  const now=new Date();
  let year=now.getFullYear();
  let d=new Date(year,monthIdx,day,12);
  const today=new Date(now.getFullYear(),now.getMonth(),now.getDate());
  if(d<today) d=new Date(year+1,monthIdx,day,12);
  return dateKey(d);
}

function isGroupeAlertLine(txt){
  return /\bø\b/i.test(txt) || /allergi/i.test(txt) || /pax\s+sans/i.test(txt) ||
    /personnes?\s+(ne\s+souhaite|sans)/i.test(txt) || /v[ée]g[ée]tarien|vegan/i.test(txt) ||
    /sans\s+(produits?|fruits?)/i.test(txt);
}
// Reconnaît un titre de plat façon "AMANDE, BURLAT, ROUGET" (tout en majuscules, plusieurs mots séparés par des virgules).
// Sert de garde-fou : si la détection du tableau de menu échoue, "Observations cuisine" ne doit jamais
// avaler un menu entier jusqu'à la fin du document faute de repère où s'arrêter.
function looksLikeDishTitleLine(txt){
  const t=(txt||'').trim();
  if(t.length<4||!t.includes(','))return false;
  const letters=t.replace(/[^A-Za-zÀ-ÖØ-öø-ÿ]/g,'');
  if(letters.length<4)return false;
  const upper=letters.replace(/[^A-ZÀ-Ö]/g,'');
  return (upper.length/letters.length)>0.9;
}
// Reconnaît les fragments de structure de menu (nombre isolé, ou mot-clé de section type "Menus"/"Vins")
// qui apparaissent quand un document n'utilise pas de tableau : ce ne sont jamais de vraies observations.
const MENU_STRUCTURE_KEYWORDS=['menu','menus','vins','choix sur place',"pâtes à pain","pates a pain","hors d'œuvres","hors d'oeuvres","salat tradition","plats enfants"];
function looksLikeMenuStructureLine(txt){
  const t=(txt||'').trim();
  if(/^\d+(\s*\/\s*\d+)?$/.test(t))return true; // nombre seul (ex: quantité issue d'un tableau non détecté)
  return MENU_STRUCTURE_KEYWORDS.includes(t.toLowerCase());
}
function splitLineByColor(line){
  let normal='';const reds=[];
  (line.segs||[]).forEach(s=>{
    const t=s.text.trim();
    if(!t)return;
    if(s.isRed)reds.push(t);
    else normal+=(normal?' ':'')+t;
  });
  return {normal:normal.trim(),reds};
}

// Convertit une liste de <w:p> en lignes {text,segs}, en découpant aussi sur les sauts de ligne manuels (w:br)
function linesFromParagraphs(paragraphs){
  const rawLines=[];
  paragraphs.forEach(p=>{
    let current=[];
    function pushSeg(text,isRed){
      if(!text)return;
      const last=current[current.length-1];
      if(last&&last.isRed===isRed)last.text+=text;
      else current.push({text,isRed});
    }
    const runs=Array.from(p.getElementsByTagName('w:r'));
    runs.forEach(r=>{
      let isRunRed=false;
      const colorEls=r.getElementsByTagName('w:color');
      if(colorEls.length){
        const val=(colorEls[0].getAttribute('w:val')||'').toUpperCase();
        if(/^[0-9A-F]{6}$/.test(val)){
          const rr=parseInt(val.slice(0,2),16),gg=parseInt(val.slice(2,4),16),bb=parseInt(val.slice(4,6),16);
          if(rr>140&&gg<110&&bb<110)isRunRed=true;
        }
      }
      Array.from(r.childNodes).forEach(node=>{
        const tag=node.nodeName;
        if(tag==='w:t'){
          pushSeg(node.textContent,isRunRed);
        }else if(tag==='w:tab'){
          pushSeg(' ',isRunRed);
        }else if(tag==='w:br'||tag==='w:cr'){
          rawLines.push(current);
          current=[];
        }
      });
    });
    rawLines.push(current);
  });
  return rawLines
    .map(segs=>segs.map(s=>({text:s.text.replace(/\s+/g,' '),isRed:s.isRed})).filter(s=>s.text.trim()))
    .filter(segs=>segs.length)
    .map(segs=>({text:segs.map(s=>s.text).join('').replace(/\s+/g,' ').trim(),segs}));
}

function cellLinesText(tc){
  return linesFromParagraphs(Array.from(tc.getElementsByTagName('w:p')));
}

// Renvoie uniquement les enfants DIRECTS d'un nœud portant un nom de balise donné
// (contrairement à getElementsByTagName, qui plonge aussi dans un éventuel tableau imbriqué
// à l'intérieur d'une cellule et mélangerait ses lignes/cellules avec celles du tableau parent).
function directChildren(el,tag){
  return Array.from(el.childNodes).filter(n=>n.nodeName===tag);
}

// Détecte si une ligne de tableau Word a une bordure de style "double" (deux traits fins), en
// bas de n'importe laquelle de ses cellules. C'est le repère visuel qu'utilisent les fiches de
// fonction pour marquer la fin d'une séquence (course) — plus fiable qu'une estimation par le
// cumul des couverts, qui peut se tromper avec des demi-portions ou plusieurs groupes.
function rowHasDoubleBorder(tr){
  const borderEls=tr.getElementsByTagName('w:tcBorders');
  for(const tb of Array.from(borderEls)){
    const edges=['w:bottom','w:top'];
    for(const edge of edges){
      const els=tb.getElementsByTagName(edge);
      for(const el of Array.from(els)){
        if((el.getAttribute('w:val')||'').toLowerCase()==='double')return true;
      }
    }
  }
  return false;
}

// Cherche le tableau du menu (1ère ligne = un nombre puis "Menu(s)") et renvoie
// à la fois son nœud DOM (pour l'exclure de l'en-tête) et ses lignes/cellules déjà lues.
// Détection volontairement souple (contient un chiffre + contient le mot "menu", au lieu d'une
// correspondance exacte) car la mise en forme Word réelle varie (espaces, cellule fusionnée, etc.).
// S'il y a plusieurs tableaux candidats, on garde celui qui a le plus de lignes : le vrai tableau
// de menu contient toujours beaucoup de plats, contrairement à un petit tableau récapitulatif isolé.
function findMenuTable(xmlDoc){
  const tblNodes=Array.from(xmlDoc.getElementsByTagName('w:tbl'));
  let best=null;
  for(const tbl of tblNodes){
    const allTrs=directChildren(tbl,'w:tr');
    if(!allTrs.length)continue;
    // La ligne d'en-tête (numéro + "menu") peut ne pas être la toute première : une ou plusieurs
    // lignes vides (espacement) peuvent précéder. On cherche à n'importe quel index.
    let headerIdx=-1;
    for(let i=0;i<allTrs.length;i++){
      const tcs=directChildren(allTrs[i],'w:tc');
      if(tcs.length<2)continue;
      const c0=cellLinesText(tcs[0]).map(l=>l.text).join(' ').trim();
      const c1=cellLinesText(tcs[1]).map(l=>l.text).join(' ').trim();
      if(/\d/.test(c0)&&/\bmenus?\b/i.test(c1)){headerIdx=i;break;}
    }
    if(headerIdx===-1)continue;
    const trs=allTrs.slice(headerIdx); // ignore toute ligne avant l'en-tête
    if(!best||trs.length>best.trs.length)best={tbl,trs};
  }
  if(best){
    const {tbl,trs}=best;
    const headerCellLines=directChildren(trs[0],'w:tc').map(tc=>cellLinesText(tc).map(l=>l.text));
    const rowBreaks=trs.map(rowHasDoubleBorder);
    const rows=trs.map(tr=>directChildren(tr,'w:tc').map(tc=>{
      const cellLines=cellLinesText(tc);
      const text=cellLines.map(l=>l.text).join(' ').trim();
      const segs=[];
        cellLines.forEach((l,i)=>{if(i>0)segs.push({text:' ',isRed:false});l.segs.forEach(s=>segs.push(s));});
        return {text,segs};
      }));
    return {node:tbl,rows,headerCellLines,rowBreaks,trNodes:trs};
  }
  return null;
}

function buildDishesFromRows(rows,rowBreaks){
  const dishes=[];
  rows.forEach((cells,idx)=>{
    const nonEmpty=cells.filter(c=>c.text);
    if(nonEmpty.length===0){
      // Ligne vide dans le tableau Word = séparation entre deux séquences (courses).
      // On la marque, sans en ajouter plusieurs de suite ni en tout début de tableau.
      if(dishes.length&&!dishes[dishes.length-1].__break)dishes.push({__break:true});
      return;
    }
    const qm=nonEmpty[0].text.match(/^(\d+)\s*(\/\s*2)?$/);
    if(qm&&nonEmpty.length>=2){
      const qty=qm[1],half=!!qm[2];
      const nameCell=nonEmpty[1];
      const {normal,reds}=splitLineByColor(nameCell);
      let name='',alerts=[];
      if(!normal&&(reds.length||isGroupeAlertLine(nameCell.text))){alerts=reds.length?reds:[nameCell.text];}
      else{name=normal||nameCell.text;alerts=reds;}
      dishes.push({qty:parseInt(qty)*(half?0.5:1),base:parseInt(qty),frac:half?0.5:1,portion:half?(qty+' × ½'):qty,name,desc:'',alerts});
    } else if(dishes.length&&!dishes[dishes.length-1].__break){
      const last=dishes[dishes.length-1];
      nonEmpty.forEach(cell=>{
        const {normal,reds}=splitLineByColor(cell);
        if(normal)last.desc=(last.desc?last.desc+' ':'')+normal;
        reds.forEach(r=>last.alerts.push(r));
        if(!normal&&!reds.length&&isGroupeAlertLine(cell.text))last.alerts.push(cell.text);
      });
    } else {
      dishes.push({qty:0,base:null,frac:1,portion:'',name:nonEmpty[0].text,desc:'',alerts:[]});
    }
    // (détection par bordure double retirée : trop de faux positifs sur ce type de document, cassait l'association plat/description)
  });
  while(dishes.length&&dishes[dishes.length-1].__break)dishes.pop(); // pas de séparateur traînant en fin de tableau
  return dishes;
}

function groupDishesIntoSequences(dishes,totalCovers){
  const strip=d=>{const{qty,base,frac,...rest}=d;return rest;};
  if(dishes.some(d=>d.__break)){
    // Découpage fiable à partir des lignes vides du tableau Word (une ligne vide = fin de séquence),
    // plutôt que de deviner via le cumul des quantités.
    const seqs=[];let current=[];
    dishes.forEach(d=>{
      if(d.__break){if(current.length){seqs.push(current);current=[];}return;}
      current.push(d);
    });
    if(current.length)seqs.push(current);
    return seqs.map(seq=>seq.map(strip));
  }
  if(dishes.length&&dishes.every(d=>d.base!==undefined)){
    // Règle vérifiée sur 3 fiches réelles (menu unique, menu à sous-groupes, menu à choix multiples) :
    // - une portion pleine (frac=1) ferme toujours sa séquence seule ;
    // - une demi-portion ferme aussi sa séquence seule, SAUF si elle complète exactement le total de
    //   couverts avec la demi-portion précédente de base différente (choix multiples pour un même
    //   service, ex. "10 × ½" + "4 × ½" = 14 couverts) — dans ce cas les deux se groupent.
    // Deux demi-portions de même base (ex. deux plats "4 × ½" à la suite) restent séparées : chacune
    // est un plat/service à part entière, la répétition de la base ne signifie pas qu'il faut grouper.
    const seqs=[];let current=[];let rawSum=0;
    function closeCurrent(){seqs.push(current);current=[];rawSum=0;}
    dishes.forEach(d=>{
      if(d.frac===1){
        if(current.length)closeCurrent();
        seqs.push([d]);
        return;
      }
      if(current.length&&totalCovers&&(rawSum+d.base)===totalCovers){
        current.push(d);rawSum+=d.base;
        closeCurrent();
      }else{
        if(current.length)closeCurrent();
        current=[d];rawSum=d.base;
        if(totalCovers&&rawSum===totalCovers)closeCurrent();
      }
    });
    if(current.length)seqs.push(current);
    return seqs.map(seq=>seq.map(strip));
  }
  // Repli (anciens documents sans champs base/frac) : cumul du total de couverts.
  if(!totalCovers||dishes.length===0)return dishes.length?[dishes.map(strip)]:[];
  const seqs=[];let current=[];let sum=0;
  dishes.forEach(d=>{
    current.push(d);
    sum+=d.qty||0;
    if(sum>=totalCovers){seqs.push(current);current=[];sum=0;}
  });
  if(current.length)seqs.push(current);
  return seqs.map(seq=>seq.map(strip));
}

async function parseGroupeDocxFile(file){
  if(!window.JSZip) throw new Error("JSZip ne s'est pas chargé (pas de réseau, ou bloqué).");
  const buf=await file.arrayBuffer();
  let zip;
  try{zip=await JSZip.loadAsync(buf);}catch(e){throw new Error("Ce fichier ne semble pas être un document Word (.docx) valide.");}
  const docXmlFile=zip.file('word/document.xml');
  if(!docXmlFile) throw new Error("Ce fichier ne semble pas être un document Word (.docx) valide.");
  const xmlText=await docXmlFile.async('text');
  const xmlDoc=new DOMParser().parseFromString(xmlText,'application/xml');
  if(xmlDoc.getElementsByTagName('parsererror').length) throw new Error("Impossible de lire le contenu de ce document Word.");

  // Menu : localisation du tableau menu par son nœud DOM (1ère ligne = nombre + "Menu(s)")
  const menuTable=findMenuTable(xmlDoc);

  // En-tête : texte à plat (label -> valeur), en excluant les paragraphes du tableau menu
  // (sinon "Observations cuisine" absorbe tout le reste du document, faute de repère pour s'arrêter)
  const allParagraphs=Array.from(xmlDoc.getElementsByTagName('w:p'));
  const headerParagraphs=menuTable?allParagraphs.filter(p=>!menuTable.trNodes.some(tr=>tr.contains(p))):allParagraphs;
  const lines=linesFromParagraphs(headerParagraphs);
  if(lines.length===0) throw new Error("Aucun texte trouvé dans ce document Word.");
  const headerText=lines.map(l=>l.text).join('\n').replace(/[\u2018\u2019\u02BC]/g,"'");

  function field(label,nextLabels){
    const idx=headerText.indexOf(label);
    if(idx===-1)return '';
    let start=idx+label.length,end=headerText.length;
    nextLabels.forEach(nl=>{const i=headerText.indexOf(nl,start);if(i!==-1&&i<end)end=i;});
    return headerText.slice(start,end).replace(/^[:\s]+/,'').trim();
  }
  const ALL=['Date :','Nom du client :','Facturation','Heure d\'arrivée :','Nombre de couverts :','Nombre de table(s) :','Observations cuisine'];
  const dateTxt=field('Date :',ALL.filter(l=>l!=='Date :'));
  const clientName=field('Nom du client :',ALL.filter(l=>l!=='Nom du client :'));
  const arrival=field('Heure d\'arrivée :',ALL.filter(l=>l!=='Heure d\'arrivée :'));
  const paxRaw=field('Nombre de couverts :',ALL.filter(l=>l!=='Nombre de couverts :'));
  const tablesRaw=field('Nombre de table(s) :',ALL.filter(l=>l!=='Nombre de table(s) :'));
  const obsRaw=field('Observations cuisine',[]);
  const pax=(paxRaw.match(/\d+/)||[''])[0];
  const tables=(tablesRaw.match(/\d+/)||[''])[0];
  let obsLines=obsRaw.split('\n').map(s=>s.replace(/^[&:\s]*p[aâ]tisserie\s*:?\s*/i,'').trim()).filter(Boolean);
  const dishTitleIdx=obsLines.findIndex(l=>looksLikeDishTitleLine(l)||looksLikeMenuStructureLine(l));
  if(dishTitleIdx!==-1)obsLines=obsLines.slice(0,dishTitleIdx); // la détection du tableau menu a probablement échoué : on s'arrête au premier vrai titre de plat
  const observations=obsLines.slice(0,8); // les vraies observations (allergies, préférences) tiennent toujours en quelques lignes

  let menuName='',menuPax='',dishes=[];
  if(menuTable){
    const headerRow=menuTable.rows[0];
    const paxLines=(menuTable.headerCellLines&&menuTable.headerCellLines[0]||[headerRow[0].text]).filter(Boolean);
    let nameLines=(menuTable.headerCellLines||[]).slice(1).flat().filter(Boolean);
    const vinIdx=nameLines.findIndex(l=>/^vins?$/i.test(l.trim()));
    if(vinIdx!==-1)nameLines=nameLines.slice(0,vinIdx); // la mention vin/accord (et tout ce qui suit) est retirée
    if(paxLines.length>1&&nameLines.length&&nameLines.length%paxLines.length===0){
      // Plusieurs groupes remplis en alternance dans la même cellule (ex : ligne adultes / ligne enfants
      // qui se répètent) : on ré-assemble chaque groupe à partir de ses lignes (index%N).
      const groups=paxLines.map(()=>[]);
      nameLines.forEach((l,i)=>groups[i%paxLines.length].push(l));
      menuPax=paxLines.join('\n');
      menuName=groups.map(g=>g.join(' ').trim()).join('\n');
    }else{
      menuPax=paxLines.join(' ');
      menuName=nameLines.join(' ').trim();
    }
    dishes=buildDishesFromRows(menuTable.rows.slice(1)); // bordure "double" abandonnée : trop de faux positifs sur ce document (toutes les lignes en ont une)
  }
  const totalCovers=parseInt((menuPax.split('\n')[0]||'').trim(),10)||parseInt(pax||'0')||0;
  const sequences=groupDishesIntoSequences(dishes,totalCovers);

  return {
    dateGuess: guessDateFromText(dateTxt),
    dateTextRaw: dateTxt,
    clientName, arrival, pax: pax||'', tables: tables||'',
    observations: observations.length?observations:[''],
    menuName: menuName||'Menu', menuPax: menuPax||pax||'',
    sequences: sequences.length?sequences:[[{portion:'',name:'',desc:'',alerts:[]}]],
    _debug: {lineCount: lines.length, hasMenuTable: !!menuTable, dateTxt, observationsTruncated: dishTitleIdx!==-1},
  };
}

function GroupeEditForm({draft,setDraft,onCancel,onSave,saving,error}){
  function setField(k,v){setDraft(prev=>({...prev,[k]:v}));}
  function setObs(i,v){setDraft(prev=>{const o=[...prev.observations];o[i]=v;return{...prev,observations:o};});}
  function addObs(){setDraft(prev=>({...prev,observations:[...prev.observations,'']}));}
  function removeObs(i){setDraft(prev=>({...prev,observations:prev.observations.filter((_,ix)=>ix!==i)}));}
  function setDish(si,di,field,v){setDraft(prev=>{const seqs=prev.sequences.map(s=>[...s]);seqs[si][di]={...seqs[si][di],[field]:v};return{...prev,sequences:seqs};});}
  function setDishAlerts(si,di,v){setDish(si,di,'alerts',v.split('\n').filter(x=>x!==undefined));}
  function addDish(si){setDraft(prev=>{const seqs=prev.sequences.map(s=>[...s]);seqs[si].push({portion:'',name:'',desc:'',alerts:[]});return{...prev,sequences:seqs};});}
  function removeDish(si,di){setDraft(prev=>{const seqs=prev.sequences.map(s=>[...s]);seqs[si]=seqs[si].filter((_,ix)=>ix!==di);return{...prev,sequences:seqs.filter(s=>s.length>0)};});}
  // Extrait un plat de sa séquence pour en faire sa propre séquence, juste après l'actuelle.
  // Déplace un plat vers le haut (-1) ou le bas (+1) au sein de sa séquence.
  function moveDish(si,di,dir){setDraft(prev=>{
    const seqs=prev.sequences.map(s=>[...s]);
    const seq=seqs[si];
    const target=di+dir;
    if(target<0||target>=seq.length)return prev;
    [seq[di],seq[target]]=[seq[target],seq[di]];
    return {...prev,sequences:seqs};
  });}
  function splitDishIntoNewSequence(si,di){setDraft(prev=>{
    const seqs=prev.sequences.map(s=>[...s]);
    const [dish]=seqs[si].splice(di,1);
    const newSeqs=[...seqs.slice(0,si+1),[dish],...seqs.slice(si+1)];
    return {...prev,sequences:newSeqs.filter(s=>s.length>0)};
  });}
  function addSequence(){setDraft(prev=>({...prev,sequences:[...prev.sequences,[{portion:'',name:'',desc:'',alerts:[]}]]}));}
  function removeSequence(si){setDraft(prev=>({...prev,sequences:prev.sequences.filter((_,ix)=>ix!==si)}));setSelectedSeqs(prev=>{const n=new Set(prev);n.delete(si);return new Set(Array.from(n).map(x=>x>si?x-1:x));});}
  const [selectedSeqs,setSelectedSeqs]=useState(()=>new Set());
  function toggleSeqSelected(si){setSelectedSeqs(prev=>{const n=new Set(prev);if(n.has(si))n.delete(si);else n.add(si);return n;});}
  // Fusionne toutes les séquences cochées en une seule, à la position de la première sélectionnée.
  function mergeSelectedSequences(){
    if(selectedSeqs.size<2)return;
    setDraft(prev=>{
      const idxs=Array.from(selectedSeqs).sort((a,b)=>a-b);
      const merged=idxs.flatMap(i=>prev.sequences[i]);
      const seqs=prev.sequences.filter((_,i)=>!selectedSeqs.has(i));
      const before=prev.sequences.slice(0,idxs[0]).filter((_,i)=>!selectedSeqs.has(i)).length;
      seqs.splice(before,0,merged);
      return {...prev,sequences:seqs};
    });
    setSelectedSeqs(new Set());
  }
  const inp={width:'100%',padding:'7px 10px',fontSize:13,border:'0.5px solid #ccc',borderRadius:7,outline:'none'};
  const lbl={fontSize:10,fontWeight:700,color:'#888',textTransform:'uppercase',marginBottom:3};
  return(<div style={{position:'fixed',inset:0,background:'#f5f4f0',zIndex:250,overflowY:'auto',padding:12}}>
    <div style={{maxWidth:560,margin:'0 auto'}}>
      <div style={{background:'#fef3c7',border:'0.5px solid #f59e0b',borderRadius:8,padding:'10px 14px',fontSize:12,color:'#92400e',marginBottom:12}}>
        Vérifie et corrige avant d'enregistrer, notamment la date et les observations d'allergie. Rien n'est encore sauvegardé.
      </div>
      {draft._debug&&(<div style={{background:'#f3f4f6',border:'0.5px solid #d1d5db',borderRadius:8,padding:'8px 14px',fontSize:11,color:'#555',marginBottom:12,fontFamily:'monospace'}}>
        {'Diagnostic : '+draft._debug.itemCount+' morceaux de texte lus, '+draft._debug.lineCount+' lignes, ligne menu détectée : '+(draft._debug.menuIdx>=0?('#'+draft._debug.menuIdx):'non trouvée')+', date lue : "'+(draft._debug.dateTxt||'—')+'"'}
      </div>)}
      {error&&<div style={{background:'#fef2f2',border:'0.5px solid #fecaca',borderRadius:8,padding:'10px 14px',fontSize:12,color:'#991b1b',marginBottom:12}}>{error}</div>}
      <div style={{background:'#fff',borderRadius:10,border:'0.5px solid #d4d2c8',padding:16,marginBottom:12}}>
        <div style={lbl}>Nom du client</div>
        <input style={{...inp,marginBottom:10}} value={draft.clientName} onChange={e=>setField('clientName',e.target.value)}/>
        <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:10,marginBottom:10}}>
          <div><div style={lbl}>Date</div><input type="date" style={inp} value={draft.dateGuess} onChange={e=>setField('dateGuess',e.target.value)}/></div>
          <div><div style={lbl}>Heure d'arrivée</div><input style={inp} value={draft.arrival} onChange={e=>setField('arrival',e.target.value)}/></div>
        </div>
        <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:10}}>
          <div><div style={lbl}>Nombre de PAX</div><input style={inp} value={draft.pax} onChange={e=>setField('pax',e.target.value)}/></div>
          <div><div style={lbl}>Nombre de table(s)</div><input style={inp} value={draft.tables} onChange={e=>setField('tables',e.target.value)}/></div>
        </div>
      </div>

      <div style={{background:'#fff',borderRadius:10,border:'0.5px solid #d4d2c8',padding:16,marginBottom:12}}>
        <div style={{...lbl,marginBottom:8}}>Observations cuisine &amp; pâtisserie</div>
        {draft.observations.map((o,i)=>(<div key={i} style={{display:'flex',gap:6,marginBottom:6}}>
          <input style={inp} value={o} onChange={e=>setObs(i,e.target.value)}/>
          <button onClick={()=>removeObs(i)} style={{fontSize:14,padding:'2px 10px',border:'none',borderRadius:6,cursor:'pointer',background:'#fee2e2',color:'#991b1b'}}>×</button>
        </div>))}

    </div>

}

function GroupeView({userEmail,roleLinge}){
  const [groups,setGroups]=useState([]);
  const [loading,setLoading]=useState(true);
  const [parsing,setParsing]=useState(false);
  const [draft,setDraft]=useState(null);
  const [editingId,setEditingId]=useState(null);
  const [viewing,setViewing]=useState(null);
  const [saving,setSaving]=useState(false);
  const [error,setError]=useState('');
  const [queue,setQueue]=useState([]);
  const fileRef=useRef(null);

  async function loadGroups(){
    setLoading(true);
    const fb=getFirebase();
    if(!fb){setLoading(false);return;}
    try{
      const col=fb.collection(fb.db,'groupe');
      const snap=await fb.getDocs(col);
      const today=dateKey(new Date());
      const items=[];
      const toDelete=[];
      snap.forEach(d=>{
        const data=d.data();
        const norm={...data,id:d.id,sequences:(data.sequences||[]).map(s=>s.dishes||s||[])};
        if(data.date&&data.date<today)toDelete.push(d.id);
        else items.push(norm);
      });
      if(!roleLinge){
        for(const id of toDelete){
          try{await fb.deleteDoc(fb.doc(fb.db,'groupe',id));}catch(e){console.error(e);}
        }
      }
      items.sort((a,b)=>(a.date||'').localeCompare(b.date||''));
      setGroups(items);
    }catch(e){console.error(e);}
    setLoading(false);
  }

  useEffect(()=>{loadGroups();},[]);

  async function processFile(file){
    setError('');
    setParsing(true);
    try{
      const parsed=await parseGroupeDocxFile(file);
      setDraft(parsed);
    }catch(err){
      console.error(err);
      setError("Impossible de lire "+(file&&file.name?file.name:'ce fichier')+" : "+(err&&err.message?err.message:'erreur inconnue'));
    }
    setParsing(false);
  }

  async function handleFile(e){
    const files=e.target.files?Array.from(e.target.files):[];
    if(fileRef.current)fileRef.current.value='';
    if(files.length===0)return;
    const [first,...rest]=files;
    setQueue(rest);
    await processFile(first);
  }

  async function advanceQueue(){
    if(queue.length===0)return;
    const [next,...rest]=queue;
    setQueue(rest);
    await processFile(next);
  }

  function cancelDraft(){
    setDraft(null);
    setEditingId(null);
    setError('');
    advanceQueue();
  }
  function editGroup(g){
    setError('');
    setEditingId(g.id);
    setDraft({
      dateGuess:g.date,
      clientName:g.clientName,
      arrival:g.arrival,
      pax:g.pax,
      tables:g.tables,
      observations:g.observations||[],
      menuName:g.menuName,
      menuPax:g.menuPax,
      sequences:g.sequences||[],
    });
  }

  async function saveDraft(){
    if(!draft)return;
    const fb=getFirebase();if(!fb)return;
    setSaving(true);
    setError('');
    const d=new Date(draft.dateGuess+'T12:00:00');
    const id=editingId||(draft.dateGuess+'_'+slugifyCheese(draft.clientName||'groupe')+'_'+Date.now());
    try{
      await fb.setDoc(fb.doc(fb.db,'groupe',id),{
        date:draft.dateGuess,
        dateDisplay:fmtDateFR(d),
        clientName:draft.clientName,
        arrival:draft.arrival,
        pax:draft.pax,
        tables:draft.tables,
        observations:draft.observations.filter(Boolean),
        menuName:draft.menuName,
        menuPax:draft.menuPax,
        sequences:draft.sequences.map(seq=>({dishes:seq})),
        savedBy:userEmail,
        savedAt:new Date().toISOString(),
      });
      setDraft(null);
      setEditingId(null);
      await loadGroups();
      advanceQueue();
    }catch(e){
      console.error(e);
      setError("Impossible d'enregistrer : "+(e&&e.message?e.message:'erreur inconnue'));
    }
    setSaving(false);
  }

  async function removeGroup(id){
    const fb=getFirebase();if(!fb)return;
    try{await fb.deleteDoc(fb.doc(fb.db,'groupe',id));setGroups(prev=>prev.filter(g=>g.id!==id));}catch(e){console.error(e);}
  }

  function groupByDate(items){
    const m={};items.forEach(it=>{const k=it.date||'';if(!m[k])m[k]=[];m[k].push(it);});
    return Object.entries(m).sort((a,b)=>a[0].localeCompare(b[0]));
  }

  if(viewing){
    return(<div style={{position:'fixed',inset:0,background:'#f5f4f0',zIndex:260,overflowY:'auto',padding:12}}>
      <div style={{maxWidth:560,margin:'0 auto'}}>
        <div style={{display:'flex',justifyContent:'flex-end',marginBottom:8}}>
          <button onClick={()=>setViewing(null)} style={{background:'#1a1a1a',color:'#fff',border:'none',borderRadius:6,padding:'7px 14px',fontSize:12,cursor:'pointer'}}>Fermer</button>
        </div>
        <GroupeCard g={viewing}/>
      </div>
    </div>);
  }

  if(draft){
    return <GroupeEditForm draft={draft} setDraft={setDraft} onCancel={cancelDraft} onSave={saveDraft} saving={saving} error={error}/>;
  }

  return(<div style={{display:'flex',flexDirection:'column',gap:10}}>
    <div style={{display:'flex',gap:8,flexWrap:'wrap',alignItems:'center',padding:'8px 12px',background:'#ececea',borderRadius:8,border:'0.5px solid #d4d2c8'}}>
      <span style={{fontSize:13,fontWeight:500}}>Groupes à venir</span>
      <div style={{flex:1}}/>
      {!roleLinge&&(<>
        <input ref={fileRef} type="file" accept=".docx,application/vnd.openxmlformats-officedocument.wordprocessingml.document" multiple style={{display:'none'}} onChange={handleFile}/>
        <button onClick={()=>fileRef.current&&fileRef.current.click()} disabled={parsing} style={{padding:'6px 12px',fontSize:12,fontWeight:600,border:'0.5px solid #378ADD',borderRadius:6,cursor:'pointer',background:'#eff6ff',color:'#1e40af',opacity:parsing?0.6:1}}>{parsing?'Lecture…':'+ Uploader un ou plusieurs Word'}</button>
        {queue.length>0&&<span style={{fontSize:11,fontWeight:600,color:'#1e40af',background:'#dbeafe',borderRadius:10,padding:'2px 8px'}}>{queue.length+' en attente'}</span>}
      </>)}
    </div>
    {error&&<div style={{background:'#fef2f2',border:'0.5px solid #fecaca',borderRadius:8,padding:'10px 14px',fontSize:12,color:'#991b1b'}}>{error}</div>}
    {loading&&<div style={{textAlign:'center',color:'#aaa',fontSize:13,padding:'30px 0'}}>Chargement…</div>}
    {!loading&&groups.length===0&&<div style={{textAlign:'center',color:'#aaa',fontSize:13,padding:'30px 0'}}>Aucun groupe à venir.</div>}
    {!loading&&groupByDate(groups).map(([d,items])=>{
      const label=d?new Date(d+'T12:00:00').toLocaleDateString('fr-FR',{weekday:'long',day:'numeric',month:'long',year:'numeric'}):'';
      return(<div key={d}>
        <div style={{fontSize:12,fontWeight:700,color:'#1a1a1a',textTransform:'capitalize',margin:'6px 2px'}}>{label}</div>
        {items.map(g=>(<div key={g.id} style={{background:'#fff',borderRadius:10,border:'0.5px solid #d4d2c8',padding:'10px 14px',marginBottom:8,display:'flex',alignItems:'center',justifyContent:'space-between'}}>
          <div>
            <div style={{fontSize:14,fontWeight:700}}>{g.clientName}</div>
            <div style={{fontSize:11,color:'#888'}}>{(g.pax||'?')+' PAX · '+(g.arrival||'?')}</div>
          </div>
          <div style={{display:'flex',gap:6}}>
            <button onClick={()=>setViewing(g)} style={{fontSize:11,padding:'4px 12px',border:'0.5px solid #86efac',borderRadius:6,cursor:'pointer',background:'#dcfce7',color:'#166534'}}>Voir</button>
            {!roleLinge&&<button onClick={()=>editGroup(g)} style={{fontSize:11,padding:'4px 12px',border:'0.5px solid #93c5fd',borderRadius:6,cursor:'pointer',background:'#eff6ff',color:'#1e40af'}}>Éditer</button>}
            {!roleLinge&&<button onClick={()=>removeGroup(g.id)} style={{fontSize:16,padding:'2px 10px',border:'none',borderRadius:4,cursor:'pointer',background:'#fee2e2',color:'#991b1b',lineHeight:1}}>×</button>}
          </div>
        </div>))}
      </div>);
    })}
  </div>);
}

function SettingsView({onClose,defaultSettings,setDefaultSettings,saveSettings}){
  const [settings,setSettings]=useState(dc(defaultSettings));
  const [activeMode,setActiveMode]=useState('off');

  const mode=activeMode==='off';
  const salleKey=mode?'defSalle':'terSalle';
  const terrKey=mode?'defTerrasse':'terTerrasse';

  async function handleSave(){
    setDefaultSettings(settings);
    await saveSettings(settings,defaultSettings);
    onClose();
  }

  const thStyle={fontSize:10,fontWeight:700,color:'#888',textTransform:'uppercase',letterSpacing:'.04em',padding:'4px 6px',textAlign:'center',borderBottom:'1px solid #e5e7eb'};
  const tdStyle={padding:'3px 4px',borderBottom:'0.5px solid #f0efe9',fontSize:12};

  function TableGrid({tables,zone}){
    const key=zone==='salle'?salleKey:terrKey;
    return(<table style={{width:'100%',borderCollapse:'collapse',marginBottom:10}}>
      <thead><tr>
        <th style={{...thStyle,textAlign:'left'}}>Table</th>
        <th style={thStyle}>Couverts</th>
        <th style={thStyle}>Plateau</th>
        <th style={thStyle}>OFF</th>
      </tr></thead>
      <tbody>{tables.map(tn=>{
        const d=settings[key][tn]||{covers:0,plateau:null,isConsole:false};
        const active=d.covers>0;
        return(<tr key={tn} style={{background:active?'#f0f9ff':'#fafaf9'}}>
          <td style={{...tdStyle,fontWeight:600,color:active?'#1e40af':'#aaa'}}>{tn}</td>
          <td style={tdStyle}><input type="text" inputMode="numeric" value={d.covers||''}
            onFocus={e=>e.target.select()}
            onChange={e=>{
              const c=parseInt(e.target.value)||0;
              const newS=dc(settings);
              if(!newS[key][tn])newS[key][tn]={covers:0,plateau:null,isConsole:false};
              newS[key][tn].covers=c;
              if(c===0){newS[key][tn].plateau=null;}
              else{newS[key][tn].plateau=suggestPlateau(tn,c,newS[key]);}
              setSettings(newS);
            }}
            style={{width:40,textAlign:'center',border:'0.5px solid #ccc',borderRadius:4,padding:'2px 4px',fontSize:12}}
          /></td>
          <td style={tdStyle}><select value={d.plateau||''} onChange={e=>{const newS=dc(settings);if(!newS[key][tn])newS[key][tn]={covers:0,plateau:null,isConsole:false};newS[key][tn].plateau=e.target.value?parseInt(e.target.value):null;setSettings(newS);}} disabled={!active} style={{fontSize:11,border:'0.5px solid #ccc',borderRadius:4,padding:'2px',background:active?'#fff':'#f5f4f0'}}>
            <option value="">-</option>
            {[100,120,140,180,200].map(pl=><option key={pl} value={pl}>{PL}{pl}</option>)}
          </select></td>
          <td style={{...tdStyle,textAlign:'center'}}><button onClick={()=>{const newS=dc(settings);newS[key][tn]={covers:0,plateau:null,isConsole:false};setSettings(newS);}} style={{fontSize:11,padding:'2px 8px',border:'0.5px solid #fca5a5',borderRadius:4,cursor:'pointer',background:'#fee2e2',color:'#991b1b'}}>×</button></td>
        </tr>);
      })}</tbody>
    </table>);
  }

  return(<div style={{position:'fixed',inset:0,background:'rgba(0,0,0,.5)',display:'flex',alignItems:'center',justifyContent:'center',zIndex:300}}>
    <div style={{background:'#f5f4f0',borderRadius:12,padding:20,width:'min(95vw,500px)',maxHeight:'85vh',overflowY:'auto',border:'0.5px solid #ddd'}}>
      <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:14}}>
        <span style={{fontWeight:700,fontSize:15}}>Paramètres</span>
        <button onClick={()=>{if(window.confirm('Fermer sans enregistrer ? Les modifications non sauvegardées seront perdues.'))onClose();}} style={{background:'none',border:'none',fontSize:22,cursor:'pointer',color:'#888'}}>×</button>
      </div>

        <div style={{fontSize:11,color:'#888',marginBottom:8}}>Taille proposée automatiquement selon le nombre de couverts.</div>

        <div style={{fontSize:11,color:'#888',margin:'8px 0'}}>Au-delà du dernier seuil : Ø200.</div>

        <div style={{fontSize:11,fontWeight:700,color:'#555',marginTop:10,marginBottom:6}}>Tables qui passent en Ø120 dès 2 couverts (au lieu de Ø100)</div>
        <div style={{display:'flex',flexWrap:'wrap',gap:5}}>
          {[...SALLE,...TERRASSE].filter(tn=>tn!=='AQUA').map(tn=>{
            const active=settings.plateauRules.smallTables.includes(tn);

          })}
        </div>
        <div style={{fontSize:11,fontWeight:700,color:'#555',marginTop:14,marginBottom:6}}>Inventaire de plateaux (Salle + Terrasse)</div>
        <div style={{display:'flex',flexWrap:'wrap',gap:8}}>
          {PLATEAUX.map(pl=>(
            <div key={pl} style={{display:'flex',alignItems:'center',gap:5}}>
              <span style={{fontSize:12,color:'#555'}}>{'Ø'+pl+' :'}</span>
              <input type="number" min="0" value={settings.plateauRules.inventory?.[pl]??0} onChange={e=>{const v=parseInt(e.target.value)||0;const newS=dc(settings);if(!newS.plateauRules.inventory)newS.plateauRules.inventory={};newS.plateauRules.inventory[pl]=v;setSettings(newS);}} onFocus={e=>e.target.select()} style={{width:50,fontSize:12,padding:'4px 6px',border:'0.5px solid #ccc',borderRadius:5}}/>
            </div>
          ))}
        </div>
      </div>

      <div style={{border:'0.5px solid #d4d2c8',borderRadius:10,padding:12,marginBottom:16}}>
        <div style={{fontSize:13,fontWeight:600,marginBottom:8}}>Mobilier — Terrasse GP</div>
        <div style={{fontSize:11,color:'#888',marginBottom:8}}>Inventaire disponible (informatif).</div>
        <div style={{display:'flex',gap:14,flexWrap:'wrap'}}>
          {[{key:'carree',label:'Tables carrées'},{key:'rectangle',label:'Tables rectangles'},{key:'chaise',label:'Chaises GP (+ coussins)'}].map(({key,label})=>(
            <label key={key} style={{display:'flex',flexDirection:'column',gap:4,fontSize:11,color:'#555'}}>
              {label}
              <input type="text" inputMode="numeric" value={(settings.gpInventory||{})[key]||0} onFocus={e=>e.target.select()} onChange={e=>{const newS=dc(settings);if(!newS.gpInventory)newS.gpInventory={carree:0,rectangle:0,chaise:0};newS.gpInventory[key]=parseInt(e.target.value)||0;setSettings(newS);}} style={{width:70,padding:'5px 8px',fontSize:13,border:'0.5px solid #ccc',borderRadius:6}}/>
            </label>
          ))}
        </div>
      </div>

      <div style={{display:'flex',gap:8,justifyContent:'flex-end'}}>
        <button onClick={onClose} style={{padding:'8px 16px',fontSize:13,border:'0.5px solid #ccc',borderRadius:8,cursor:'pointer',background:'#fff',color:'#555'}}>Annuler</button>
        <button onClick={handleSave} style={{padding:'8px 20px',fontSize:13,fontWeight:600,border:'none',borderRadius:8,cursor:'pointer',background:'#1a1a1a',color:'#fff'}}>Sauvegarder</button>
      </div>
    </div>
  </div>);
}
