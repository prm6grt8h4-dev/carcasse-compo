<script>
// Auto-mise à jour pour l'icône "écran d'accueil" (iOS ne revérifie pas seul les nouvelles versions).
// Compare la date de dernière modification du fichier réellement servi à celle vue au dernier
// lancement ; si elle a changé, recharge une fois automatiquement. Rien à faire lors des déploiements :
// aucun fichier de version à tenir à jour, ça se base sur ce que GitHub fournit déjà tout seul.
(function(){
  try{
    if(location.search.indexOf('_r=')!==-1){history.replaceState(null,'',location.pathname);}
    var KEY='lxv_app_version_fingerprint';
    var last=localStorage.getItem(KEY);
    fetch(location.pathname+'?_check='+Date.now(),{cache:'no-store'}).then(function(res){
      var fp=res.headers.get('last-modified')||res.headers.get('etag')||'';
      if(!fp)return; // rien à comparer : on ne fait rien plutôt que de risquer une boucle de rechargement
      if(last&&last!==fp){
        localStorage.setItem(KEY,fp);
        location.replace(location.pathname+'?_r='+Date.now());
      }else if(!last){
        localStorage.setItem(KEY,fp);
      }
    }).catch(function(){});
  }catch(e){}
})();
</script>

<script>
(function(){
  function showCrash(msg){
    var root=document.getElementById('root');
    if(!root)return;
    if(document.getElementById('global-crash-banner'))return; // n'affiche que la première erreur
    var el=document.createElement('div');
    el.id='global-crash-banner';
    el.style.cssText='position:fixed;inset:0;background:#fff;color:#1a1a1a;font-family:system-ui,sans-serif;padding:20px;z-index:99999;overflow:auto;';
    el.innerHTML='<div style="font-weight:700;font-size:16px;color:#991b1b;margin-bottom:10px;">Erreur au chargement de l\'application</div>'+
      '<div style="font-size:13px;color:#555;margin-bottom:14px;">Envoie ce texte tel quel :</div>'+
      '<pre style="white-space:pre-wrap;word-break:break-word;font-size:12px;background:#f5f4f0;border:0.5px solid #d4d2c8;border-radius:8px;padding:12px;">'+
      String(msg).replace(/</g,'&lt;')+'</pre>'+
      '<button onclick="location.reload()" style="margin-top:14px;padding:8px 16px;font-size:13px;font-weight:600;border:none;border-radius:8px;cursor:pointer;background:#1a1a1a;color:#fff;">Recharger</button>';
    document.body.appendChild(el);
  }
  window.addEventListener('error',function(e){
    var err=e.error;
    var msg=(err&&err.message)||e.message||'Erreur inconnue';
    var stack=(err&&err.stack)||'';
    // "Script error." sans nom de fichier ni pile n'est jamais exploitable (erreur inter-origines
    // opaque, souvent générée par le navigateur lui-même, pas par notre code) : on l'ignore pour
    // éviter une fausse alerte de plantage.
    if(msg==='Script error.' && !e.filename && !stack){
      console.warn('Erreur opaque ignorée (Script error. sans détail) :', e);
      return;
    }
    showCrash('MESSAGE: '+msg+(e.filename?(' ('+e.filename+':'+e.lineno+':'+e.colno+')'):'')+'\n\nSTACK:\n'+stack);
  });
  window.addEventListener('unhandledrejection',function(e){
    var r=e.reason;
    showCrash((r&&(r.stack||r.message))||String(r)||'Promesse rejetée sans message');
  });
})();
</script>

// ─── Auto-rechargement quand une nouvelle version est déployée ────────────────
// Un onglet laissé ouvert (arrière-plan, tablette murale, iPad de service) peut tourner
// indéfiniment sur du code JS périmé après un nouveau déploiement, avec des conséquences
// concrètes (ex. écrasement de données par un ancien mécanisme déjà corrigé ailleurs).
// APP_VERSION doit être changé à chaque déploiement (ex. horodatage) pour que ce mécanisme
// détecte la différence.
const APP_VERSION='2026-09-26T02:30:00Z';
let appVersionCheckInFlight=false;
async function checkForNewAppVersion(reloadImmediately){
  if(appVersionCheckInFlight)return;
  appVersionCheckInFlight=true;
  try{
    const res=await fetch(window.location.pathname+'?_v='+Date.now(),{cache:'no-store'});
    const text=await res.text();
    const m=text.match(/const APP_VERSION='([^']+)'/);
    if(m&&m[1]&&m[1]!==APP_VERSION){
      if(reloadImmediately){
        window.location.reload();
      }else{
        const banner=document.getElementById('newVersionBanner');
        if(banner)banner.style.display='flex';
      }
    }
  }catch(e){/* pas de réseau ou fetch bloqué : on retentera au prochain déclenchement */}
  appVersionCheckInFlight=false;
}
document.addEventListener('visibilitychange',()=>{
  // Moment le moins perturbateur pour un rechargement silencieux : l'onglet redevient visible,
  // l'utilisateur n'est pas en train de taper au milieu d'une action.
  if(document.visibilityState==='visible')checkForNewAppVersion(true);
});
setInterval(()=>{
  // Pendant une utilisation continue (tablette toujours affichée), on vérifie régulièrement
  // mais on avertit seulement au lieu de recharger d'autorité au milieu d'une action.
  if(document.visibilityState==='visible')checkForNewAppVersion(false);
},10*60*1000);

// Compte les plateaux utilisés (Salle + Terrasse confondues, AQUA inclus) pour un service donné,
// et renvoie les tailles qui dépassent l'inventaire disponible.
function checkPlateauOverflow(svcData){
  if(!svcData)return [];
  const inventory=(PLATEAU_RULES_OVERRIDE&&PLATEAU_RULES_OVERRIDE.inventory)||DEFAULT_PLATEAU_RULES.inventory;
  const used={};
  [...SALLE,...TERRASSE].forEach(tn=>{
    const d=svcData[tn];
    if(d&&d.covers>0&&d.plateau){used[d.plateau]=(used[d.plateau]||0)+1;}
  });
  const overflow=[];
  Object.keys(used).forEach(size=>{
    const total=inventory[size]??0;
    if(used[size]>total)overflow.push({size:parseInt(size),used:used[size],total});
  });
  return overflow.sort((a,b)=>a.size-b.size);
}

function computeTransfers(upList,dnList){const upQ=upList.map(x=>({...x})),dnQ=dnList.map(x=>({...x})),transfers=[];const isSl=tn=>SALLE.includes(tn),isTr=tn=>TERRASSE.includes(tn);const sz=(a,b)=>(isSl(a)&&isSl(b))||(isTr(a)&&isTr(b));for(let pass=0;pass<2;pass++){for(let i=0;i<upQ.length;i++){if(!upQ[i].n)continue;for(let j=0;j<dnQ.length;j++){if(!dnQ[j].n)continue;if(pass===0&&!sz(upQ[i].tn,dnQ[j].tn))continue;const give=Math.min(upQ[i].n,dnQ[j].n);if(give>0)transfers.push({from:dnQ[j].tn,to:upQ[i].tn,n:give});upQ[i].n-=give;dnQ[j].n-=give;if(!upQ[i].n)break;}}}return{transfers,netUp:upQ.filter(x=>x.n>0),netDn:dnQ.filter(x=>x.n>0)};}

function match1to1(neededList,releasedList,matchKey){const nedQ=neededList.map(x=>({...x,used:false})),relQ=releasedList.map(x=>({...x,used:false}));const transfers=[],usedTo={},usedFrom={};const isSl=tn=>SALLE.includes(tn),isTr=tn=>TERRASSE.includes(tn);const sz=(a,b)=>(isSl(a)&&isSl(b))||(isTr(a)&&isTr(b));for(let pass=0;pass<2;pass++){for(let i=0;i<nedQ.length;i++){const ned=nedQ[i];if(ned.used)continue;for(let j=0;j<relQ.length;j++){const rel=relQ[j];if(rel.used)continue;if(rel[matchKey]!==ned[matchKey])continue;if(rel.tn===ned.tn)continue;if(pass===0&&!sz(rel.tn,ned.tn))continue;if(usedTo[ned.tn]||usedFrom[rel.tn])continue;const item={fromTn:rel.tn,toTn:ned.tn,[matchKey]:rel[matchKey]};if(rel.pied!==undefined)item.pied=rel.pied;transfers.push(item);usedTo[ned.tn]=true;usedFrom[rel.tn]=true;rel.used=true;ned.used=true;break;}}}return{transfers,ascents:nedQ.filter(x=>!x.used),descents:relQ.filter(x=>!x.used)};}

function getSalleEmpireData(tables,depId,interId,arrId){
  const depSvc=tables[depId],interSvc=tables[interId],arrSvc=tables[arrId];
  if(!depSvc||!interSvc||!arrSvc)return null;
  const allT=[...SALLE,...TERRASSE];
  const plCount=svc=>{const m={};allT.forEach(tn=>{const d=svc[tn];if(!d||d.covers<=0||!d.plateau)return;m[d.plateau]=(m[d.plateau]||0)+1;});return m;};
  const piedCount=svc=>{let petit=0,gros=0;allT.forEach(tn=>{const d=svc[tn];if(!d||d.covers<=0||!d.plateau)return;if(piedFromPlateau(d.plateau)==='petit')petit++;else gros++;});return{petit,gros};};
  const fauteuilCount=svc=>{let n=0;allT.forEach(tn=>{const d=svc[tn];if(d&&d.covers>0&&!d.isConsole)n+=d.covers;});return n;};
  const cavallinoCount=svc=>{let n=0;allT.forEach(tn=>{const d=svc[tn];if(d&&d.covers>0&&!d.isConsole)n+=getCavallino(tn,d.covers);});return n;};
  const depPl=plCount(depSvc),interPl=plCount(interSvc),arrPl=plCount(arrSvc);
  const depPied=piedCount(depSvc),interPied=piedCount(interSvc),arrPied=piedCount(arrSvc);
  const depF=fauteuilCount(depSvc),interF=fauteuilCount(interSvc),arrF=fauteuilCount(arrSvc);
  const depC=cavallinoCount(depSvc),interC=cavallinoCount(interSvc),arrC=cavallinoCount(arrSvc);
  const mv=(D,M,J)=>{const idleSpare=Math.max(0,D-M),gap=Math.max(0,J-M),salleEmpire=Math.min(idleSpare,gap);return{salleEmpire,salleReserve:idleSpare-salleEmpire,reserveSalle:Math.max(0,M-D),reserveEmpire:gap-salleEmpire};};
  const allPlSizes=[...new Set([...Object.keys(depPl),...Object.keys(interPl),...Object.keys(arrPl)].map(Number))].sort((a,b)=>a-b);
  const plMvt={};
  allPlSizes.forEach(pl=>{const r=mv(depPl[pl]||0,interPl[pl]||0,arrPl[pl]||0);if(r.salleEmpire||r.salleReserve||r.reserveSalle||r.reserveEmpire)plMvt[pl]=r;});
  const piedMvt={};
  ['petit','gros'].forEach(p=>{const r=mv(depPied[p]||0,interPied[p]||0,arrPied[p]||0);if(r.salleEmpire||r.salleReserve||r.reserveSalle||r.reserveEmpire)piedMvt[p]=r;});
  const fMvt=mv(depF,interF,arrF);
  const cMvt=mv(depC,interC,arrC);
  return{plMvt,piedMvt,fMvt,cMvt};
}

function getMvtData(tables,services,currentService){
  const idx=services.findIndex(s=>s.id===currentService);let prevId=null;
  if(currentService==='mar-d-next')prevId='sam-d';else if(idx>0)prevId=services[idx-1].id;
  if(!prevId)return null;
  const prevSvc=tables[prevId],currSvc=tables[currentService];if(!prevSvc||!currSvc)return null;
  const allT=[...SALLE,...TERRASSE];const cN=countNappes(currSvc);
  const plNeeded=[],plReleased=[],piedNeeded=[],piedReleased=[],fauteuilsUp=[],fauteuilsDn=[],cavallinoUp=[],cavallinoDn=[];
  allT.forEach(tn=>{const pd=prevSvc[tn]||null,cd=currSvc[tn]||null;const pAct=pd&&pd.covers>0,cAct=cd&&cd.covers>0;const pPl=pAct?pd.plateau:null,cPl=cAct?cd.plateau:null;const pCons=pAct&&pd.isConsole,cCons=cAct&&cd.isConsole;const pPied=pPl?piedFromPlateau(pPl):null,cPied=cPl?piedFromPlateau(cPl):null;if(pAct&&!cAct){if(pPl)plReleased.push({tn,pl:pPl,pied:pPied});piedReleased.push({tn,pied:pPied});}else if(!pAct&&cAct){if(cPl)plNeeded.push({tn,pl:cPl,pied:cPied});piedNeeded.push({tn,pied:cPied});}else if(pAct&&cAct){if(pPl!==cPl){if(pPl)plReleased.push({tn,pl:pPl,pied:pPied});if(cPl)plNeeded.push({tn,pl:cPl,pied:cPied});}if(pPied!==cPied){piedReleased.push({tn,pied:pPied});piedNeeded.push({tn,pied:cPied});}}if(pAct&&!cAct){if(!pCons){fauteuilsDn.push({tn,n:pd.covers});const cv=getCavallino(tn,pd.covers);if(cv>0)cavallinoDn.push({tn,n:cv});}}else if(!pAct&&cAct){if(!cCons){fauteuilsUp.push({tn,n:cd.covers});const cv=getCavallino(tn,cd.covers);if(cv>0)cavallinoUp.push({tn,n:cv});}}else if(pAct&&cAct){if(!pCons&&!cCons){const df=cd.covers-pd.covers;if(df>0)fauteuilsUp.push({tn,n:df});if(df<0)fauteuilsDn.push({tn,n:-df});}else if(pCons&&!cCons)fauteuilsUp.push({tn,n:cd.covers});else if(!pCons&&cCons)fauteuilsDn.push({tn,n:pd.covers});const pc=getCavallino(tn,pCons?0:pd.covers),cc=getCavallino(tn,cCons?0:cd.covers);if(cc>pc)cavallinoUp.push({tn,n:cc-pc});if(pc>cc)cavallinoDn.push({tn,n:pc-cc});}});
  const plR=match1to1(plNeeded,plReleased,'pl');const piR=match1to1(piedNeeded,piedReleased,'pied');const fTr=computeTransfers(fauteuilsUp,fauteuilsDn);const cTr=computeTransfers(cavallinoUp,cavallinoDn);
  // Batteries: only for the last service before mar-d-next
  // = number of active tables (covers>0) in mar-d-next, 1 battery per table regardless of pied or OFF
  let batteries=0;
  const marNextSvc=tables['mar-d-next'];
  const isLastBeforeNext=currentService==='sam-d'||(()=>{const idx2=services.findIndex(s=>s.id===currentService);const nextSvc=services[idx2+1];return nextSvc&&nextSvc.id==='mar-d-next';})();
  if(isLastBeforeNext&&marNextSvc){[...SALLE,...TERRASSE].forEach(tn=>{const d=marNextSvc[tn];if(d&&d.covers>0)batteries++;});}
  return{plAscents:plR.ascents,plDescents:plR.descents,plTransfers:plR.transfers,piedAscents:piR.ascents,piedDescents:piR.descents,piedTransfers:piR.transfers,fTr,cTr,upN220:cN.n220,upN260:cN.n260,upN280:cN.n280,batteries,prevLabel:services.find(s=>s.id===prevId)?.label??prevId};
}

// --- Terrasse GP : suggestion automatique de mobilier selon le nombre de pax ---
// [min pax, max pax, nb tables carrées, nb tables rectangles]. Rien au-delà de 14 (pas de place).
const GP_TABLE_MAP=[[1,2,1,0],[3,4,0,1],[5,6,1,1],[7,8,0,2],[9,10,1,2],[11,12,0,3],[13,14,1,3]];
function gpSuggest(pax){
  for(const [mn,mx,c,r] of GP_TABLE_MAP){if(pax>=mn&&pax<=mx)return{carree:c,rectangle:r};}
  return {carree:0,rectangle:0};
}
// Totaux de mobilier GP pour un service (tables assemblées + mobilier libre avec note)
function computeGpTotals(gp){
  if(!gp||!gp.active)return {carree:0,rectangle:0,chaise:0};
  let carree=0,rectangle=0,chaise=0;
  (gp.tables||[]).forEach(t=>{carree+=t.carree||0;rectangle+=t.rectangle||0;chaise+=t.chairs||0;});
  (gp.extra||[]).forEach(e=>{
    if(e.type==='carree')carree+=e.qty||0;
    else if(e.type==='rectangle')rectangle+=e.qty||0;
    else if(e.type==='chaise')chaise+=e.qty||0;
  });
  return {carree,rectangle,chaise};
}
// Mouvement de mobilier GP entre le service précédent et le service en cours (à monter / à descendre)
function getGpMvtData(gpData,services,currentService){
  const idx=services.findIndex(s=>s.id===currentService);let prevId=null;
  if(currentService==='mar-d-next')prevId='sam-d';else if(idx>0)prevId=services[idx-1].id;
  if(!prevId)return null;
  const p=computeGpTotals((gpData||{})[prevId]);
  const c=computeGpTotals((gpData||{})[currentService]);
  const up={},down={};
  ['carree','rectangle','chaise'].forEach(k=>{
    const diff=c[k]-p[k];
    if(diff>0)up[k]=diff;else if(diff<0)down[k]=-diff;
  });
  return {up,down};
}

function getLingeData(tables,services){
  const WK_IDS=['mar-d','mer-d','jeu-d','ven-dj','ven-d','sam-dj','sam-d'];const VENDSAM=['ven-dj','ven-d','sam-dj','sam-d'];
  const extraIds=services.filter(s=>s.extra&&!s.nextWeek).map(s=>s.id);
  const allIds=[...WK_IDS,...extraIds].filter(id=>services.some(s=>s.id===id));
  function countLN(sd){const cnt={180:0,200:0,220:0,260:0,280:0};[...SALLE,...TERRASSE].forEach(tn=>{const d=sd[tn];if(d&&d.covers>0&&d.plateau&&LINGE_NAPPE_MAP[d.plateau])cnt[LINGE_NAPPE_MAP[d.plateau]]++;});return cnt;}
  let wkF=0,vsF=0;const wkN={180:0,200:0,220:0,260:0,280:0},vsN={180:0,200:0,220:0,260:0,280:0};
  allIds.forEach(id=>{const sd=tables[id];if(!sd)return;let f=0;[...SALLE,...TERRASSE].forEach(tn=>{const d=sd[tn];if(d&&d.covers>0&&!d.isConsole)f+=d.covers;});const cn=countLN(sd);wkF+=f;[180,200,220,260,280].forEach(k=>{wkN[k]+=cn[k];});const isVS=VENDSAM.includes(id)||services.some(s=>s.id===id&&s.extra);if(isVS){vsF+=f;[180,200,220,260,280].forEach(k=>{vsN[k]+=cn[k];});}});
  return{wkF,vsF,wkN,vsN};
}

function sortMembers(members){return[...members].sort((a,b)=>{const ra=ROLE_ORDER.indexOf(a.role),rb=ROLE_ORDER.indexOf(b.role);if(ra!==rb)return(ra===-1?99:ra)-(rb===-1?99:rb);if(a.id==='victoria')return -1;if(b.id==='victoria')return 1;return a.name.localeCompare(b.name);});}

function buildFluxRows(fluxKey,plMvt,piedMvt,fMvt,cMvt){
  const rows=[];
  ['petit','gros'].forEach(p=>{const m=piedMvt[p];if(m&&m[fluxKey]>0){const n=m[fluxKey];rows.push(`${n} ${p}${n>1?'s':''} pied${n>1?'s':''}`);}});
  [100,120,140,180,200].forEach(pl=>{const m=plMvt[pl];if(m&&m[fluxKey]>0){const n=m[fluxKey];rows.push(`${n} plateau${n>1?'x':''} ${PL}${pl}`);}});
  if(fMvt&&fMvt[fluxKey]>0){const n=fMvt[fluxKey];rows.push(`${n} fauteuil${n>1?'s':''}`);}
  if(cMvt&&cMvt[fluxKey]>0){const n=cMvt[fluxKey];rows.push(`${n} cavallino`);}
  return rows;
}

function sameTableSet(a,b){return a.length===b.length&&a.every(x=>b.includes(x));}
function activeTablesFor(list,svcData){return list.filter(tn=>{const d=svcData[tn];return d&&d.covers>0&&!d.isConsole;});}

// Nom automatique pour un ensemble de tables : "Salle" si toutes les tables ACTIVES de la salle
// (hors Aqua) sont présentes, "Terrasse" si toutes les tables ACTIVES de la terrasse, sinon la liste triée.
function autoNameForTableIds(ids,svcData){
  if(ids.length===0)return 'Rang';
  const activeSalle=activeTablesFor(SALLE.filter(t=>t!=='AQUA'),svcData||{});
  const activeTerrasse=activeTablesFor(TERRASSE,svcData||{});
  if(activeSalle.length>0&&sameTableSet(ids,activeSalle))return 'Salle';
  if(activeTerrasse.length>0&&sameTableSet(ids,activeTerrasse))return 'Terrasse';
  const TABLE_ORDER=[...SALLE,...TERRASSE];
  return [...ids].sort((a,b)=>TABLE_ORDER.indexOf(a)-TABLE_ORDER.indexOf(b)).join(' ')||'Rang';
}

// Nom affiché d'un rang : si le nom stocké est encore "auto" (liste des tables dans n'importe
// quel ordre, ou déjà "Salle"/"Terrasse"/"Rang"), on recalcule Salle/Terrasse/l'ordre canonique
// à l'affichage, sur la base des tables actives du service. Un nom réellement personnalisé reste intact.
function rangDisplayName(rang,svcData){
  const ids=rang.tableIds||[];
  if(ids.length===0)return rang.name||'Rang';
  const nameParts=(rang.name||'').split(' ').filter(Boolean);
  const isAuto=sameTableSet(nameParts,ids)||rang.name==='Nouveau rang'||rang.name==='Rang'||rang.name==='Salle'||rang.name==='Terrasse';
  if(!isAuto)return rang.name;
  return autoNameForTableIds(ids,svcData);
}

function CompoView({services,currentService,setCurrentService,tables,compos,setCompos,team,setTeam,save,saveServicesAndTeam,allSvcState,userEmail,planning}){

  function gfSuffix(memberId){
    try{
      const m=team.find(x=>x.id===memberId);

      const cell=getPlnCellForCompoMember(planning,memberId,currentService);
      return cell?extractGF(cell.horaire):null;
    }catch(e){return null;}
  }
  const tableRangCount={};[...SALLE,...TERRASSE].forEach(tn=>{tableRangCount[tn]=0;});compo.rangs.forEach(r=>r.tableIds.forEach(tn=>{tableRangCount[tn]=(tableRangCount[tn]||0)+1;}));
  const [selectedRangId,setSelectedRangId]=useState(null);const [editingRangId,setEditingRangId]=useState(null);const [editingRangName,setEditingRangName]=useState('');const [editingZoneId,setEditingZoneId]=useState(null);const [editingZoneName,setEditingZoneName]=useState('');const [showExport,setShowExport]=useState(false);const [showInit,setShowInit]=useState(false);const [selectedZoneKey,setSelectedZoneKey]=useState(null);const [selectedZoneIsExtra,setSelectedZoneIsExtra]=useState(false);const [showArchiveCompo,setShowArchiveCompo]=useState(false);const [archiveCompo,setArchiveCompo]=useState([]);const [archiveCompoLoading,setArchiveCompoLoading]=useState(false);const [selectedArchiveEntry,setSelectedArchiveEntry]=useState(null);

  // Écrit réellement les personnes "Off" du Planning dans la zone Out (mêmes données qu'un
  // ajout manuel : même couleur, comptées comme assignées, zone passée sur ON). On ne retire
  // que ce qu'on avait nous-même ajouté (autoMemberIds), jamais un ajout manuel d'autrui.
  useEffect(()=>{
    try{
      const zone=compo.zones.Out;
      const prevAuto=zone.autoMemberIds||[];
      const newAuto=autoOutIds;
      const same=prevAuto.length===newAuto.length&&prevAuto.every(id=>newAuto.includes(id));
      if(same)return;
      const keepManual=zone.memberIds.filter(id=>!prevAuto.includes(id));
      const merged=[...new Set([...keepManual,...newAuto])];

      updateCompo({...compo,zones:{...compo.zones,Out:newZone}});

  async function saveCompoArchive(){

  }
  const assignedIds=new Set();compo.rangs.forEach(r=>r.memberIds.forEach(id=>assignedIds.add(id)));Object.values(compo.zones).forEach(z=>z.memberIds.forEach(id=>assignedIds.add(id)));compo.extraZones.forEach(z=>z.memberIds.forEach(id=>assignedIds.add(id)));
  function updateCompo(newCompo){const newCompos={...compos,[currentService]:newCompo};setCompos(newCompos);save(allSvcState.services,allSvcState.tables,allSvcState.terrasseMode,allSvcState.manual,currentService,newCompos,team);}

// Détecte la lettre G/F d'un horaire en ne regardant que sa fin (dernière ligne, dernier "/ G" ou "- F"),
// plutôt qu'une comparaison de texte intégral : une case avec un horaire personnalisé mais qui se termine
// bien par "/ G" ou "/ F" reste reconnue, au lieu de bloquer silencieusement la rotation pour toujours.
function plnHoraireLetter(str){
  if(!str)return null;
  const lastLine=String(str).split('\n').pop().trim();
  const m=lastLine.match(/[-/]\s*([GF])\s*$/i);
  return m?m[1].toUpperCase():null;
}

const PLN_WEEKDAY_NAMES=['Dimanche','Lundi','Mardi','Mercredi','Jeudi','Vendredi','Samedi']; // Date.getDay(): 0=dimanche
const PLN_MONTH_NAMES=['janvier','février','mars','avril','mai','juin','juillet','août','septembre','octobre','novembre','décembre'];
function plnGetWeekDates(startDateISO){
  const start=new Date(startDateISO+'T00:00:00');
  return PLN_DAYS.map((d,i)=>{const dt=new Date(start);dt.setDate(start.getDate()+i);return dt;});
}
function plnDayLabel(dt){return PLN_WEEKDAY_NAMES[dt.getDay()]+' '+dt.getDate();}
function plnISO(dt){return dt.getFullYear()+'-'+String(dt.getMonth()+1).padStart(2,'0')+'-'+String(dt.getDate()).padStart(2,'0');}
function getMondayISO(d){
  const day=d.getDay(); // 0=dimanche,1=lundi,...
  const diff=day===0?-6:1-day;
  const monday=new Date(d);
  monday.setDate(d.getDate()+diff);
  return monday.getFullYear()+'-'+String(monday.getMonth()+1).padStart(2,'0')+'-'+String(monday.getDate()).padStart(2,'0');
}
function plnMonthReminder(dates){
  const d0=dates[0],d1=dates[dates.length-1];
  let text;
  if(d0.getMonth()===d1.getMonth()&&d0.getFullYear()===d1.getFullYear()){
    text=PLN_MONTH_NAMES[d0.getMonth()]+' '+d0.getFullYear();
  }else{
    text=PLN_MONTH_NAMES[d0.getMonth()]+(d0.getFullYear()!==d1.getFullYear()?' '+d0.getFullYear():'')+' – '+PLN_MONTH_NAMES[d1.getMonth()]+' '+d1.getFullYear();
  }
  return text.charAt(0).toUpperCase()+text.slice(1);
}

  const [dividerPositions,setDividerPositions]=useState([]);

  // événements passés dans Groupe) : une fois le lendemain de leur dernier jour atteint, ils
  // sont retirés du planning vivant (équipe + horaires). Les semaines déjà archivées ne sont
  // jamais affectées, donc l'historique reste intact.
  useEffect(()=>{
    if(readOnly)return;
    // Comparaison à startDateISO (le début de la semaine actuellement chargée), pas à la date réelle
    // d'aujourd'hui : sinon quelqu'un dont la fin tombe cette semaine restait affiché sur les semaines
    // suivantes tant que sa date de fin réelle n'était pas encore passée dans la vraie vie.
    const expired=team.filter(m=>m.dateFin&&m.dateFin<startDateISO);
    if(expired.length===0)return;
    const expiredIds=expired.map(m=>m.id);
    const newTeam=team.filter(m=>!expiredIds.includes(m.id));
    const newSchedule={...schedule};expiredIds.forEach(id=>{delete newSchedule[id];});
    commit({team:newTeam,schedule:newSchedule});
  },[team,readOnly]);

  useLayoutEffect(()=>{
    const wrapper=wrapperRef.current;
    const table=tableRef.current;
    if(!wrapper||!table)return;
    const wrapperRect=wrapper.getBoundingClientRect();
    const width=table.scrollWidth;
    const positions=[];
    const currentDividers=computeDividers();
    team.forEach((member,idx)=>{
      const level=currentDividers[idx];
      const rowEl=rowRefs.current[idx];
      if(level>0&&rowEl){
        const rect=rowEl.getBoundingClientRect();
        positions.push({top:Math.round(rect.bottom-wrapperRect.top+wrapper.scrollTop-1),level,width,idx});
      }
    });
    setDividerPositions(prev=>{
      const same=prev.length===positions.length&&prev.every((p,i)=>p.top===positions[i].top&&p.level===positions[i].level&&p.width===positions[i].width);
      return same?prev:positions; // identique -> on renvoie la même référence, React n'effectue pas de nouveau rendu
    });
  });

  useEffect(()=>{
    const raw=data.team;
    if(!raw)return;
    const needsFix=raw.some(m=>PLN_ROLE_FIXUPS[m.id]&&m.role==='Stagiaire');
    if(needsFix)commit({team:plnNormalizeTeam(raw)});
  },[data.team]);

  function commit(next){
    const merged={...data,...next}; // préserve tous les champs existants (groupOptions, fixedPatternsOverride...), pas seulement les 6 connus
    setPlanning(merged);
    savePlanning(next); // n'envoie que les champs réellement modifiés, en écriture ciblée dot-notation
  }

  // Modifie planning.team via une transaction Firestore : relit la version la plus fraîche du
  // serveur au moment de l'écriture (pas la copie en mémoire de CET appareil, qui peut dater de
  // plusieurs heures si l'onglet est resté ouvert en arrière-plan), y applique le même changement,
  // puis écrit le résultat de façon atomique. Élimine le risque qu'un appareil resté ouvert toute la
  // journée écrase silencieusement les modifications faites ailleurs entre-temps (ex. les genres).
  async function updateTeamTransactional(updater){
    const fb=getFirebase();
    if(!fb){
      const resultTeam=updater(team);
      commit({team:resultTeam}); // hors ligne : pas de transaction possible, repli sur le comportement local habituel
      return resultTeam;
    }
    try{
      const ref=fb.doc(fb.db,'app','state');
      let resultTeam=null;
      await fb.runTransaction(fb.db,async(tx)=>{
        const snap=await tx.get(ref);
        const remoteData=snap.exists()?snap.data():{};
        const freshTeam=(remoteData.planning&&remoteData.planning.team)||team;
        resultTeam=updater(freshTeam);
        tx.update(ref,{'planning.team':resultTeam});
      });
      if(resultTeam)setPlanning(p=>({...(p||DEFAULT_PLANNING),team:resultTeam}));
      return resultTeam;
    }catch(e){
      console.error('Mise à jour transactionnelle de l\'équipe échouée :',e);
      const resultTeam=updater(team);
      commit({team:resultTeam}); // au moins tenter la sauvegarde habituelle plutôt que de perdre le changement
      return resultTeam;
    }
  }

  function getCell(memberId,dayKey){return (schedule[memberId]&&schedule[memberId][dayKey])||null;}

  // Cascade des tâches (Vaisseliers 1/2, Salle, Salle - Fromage) entre les Cheffes/Chefs de
  // rang (pas le 1er Commis, qui garde toujours MEP Meuble). Ce n'est pas un jour fixe qui
  // décide : c'est la tâche choisie pour UNE personne, un jour donné, qui détermine celle de
  // toutes les autres par cascade (dans l'ordre d'affichage), en respectant le cycle
  // [Vaisseliers 1 -> Vaisseliers 2 -> Salle -> Salle - Fromage -> (retour au début)].
  const RANG_ROTATION_ROLES=['Cheffe de rang','1/2 Cheffe de rang','Chef de rang','1/2 Chef de rang'];
  function isRangRotationRole(member){return !!member&&RANG_ROTATION_ROLES.includes(member.role);}
  const RANG_TACHE_CYCLE=PLN_TACHE_OPTIONS.filter(t=>t!=='MEP Meuble'); // dérivé de PLN_TACHE_OPTIONS : une seule liste à maintenir
  function applyRangTacheCascade(newSchedule,dayKey,triggerMemberId,triggerTache){
    const rangMembers=team.filter(isRangRotationRole); // ordre d'affichage réel
    const triggerPos=rangMembers.findIndex(m=>m.id===triggerMemberId);
    const cycleIdx=RANG_TACHE_CYCLE.indexOf(triggerTache);
    if(triggerPos===-1||cycleIdx===-1)return; // tâche hors cycle connu : pas de cascade
    const n=RANG_TACHE_CYCLE.length;
    const dayOrder=['mar','mer','jeu'];
    const startIdx=dayOrder.indexOf(dayKey);
    if(startIdx===-1)return;
    const rangFixedPattern=fixedOverrides['_rang']||PLN_RANG_FIXED_PATTERN; // respecte l'horaire personnalisé de Paramètres
    dayOrder.forEach((day,di)=>{
      if(di<startIdx)return; // seulement le jour édité et les jours suivants, jamais en arrière
      const steps=di-startIdx;
      rangMembers.forEach((m,p)=>{
        if(day===dayKey&&m.id===triggerMemberId)return; // la cellule éditée garde exactement ce qui vient d'être saisi
        const existing=(newSchedule[m.id]&&newSchedule[m.id][day])||{};
        if(existing.tacheManual)return; // ne pas écraser une case déjà modifiée à la main
        const tacheValue=RANG_TACHE_CYCLE[(cycleIdx-triggerPos+p-steps+n*4)%n];
        newSchedule[m.id]={...(newSchedule[m.id]||{}),[day]:{horaire:existing.horaire||rangFixedPattern[day],tache:tacheValue,alerte:existing.alerte||'',off:false}};
      });
    });
  }

  function applyFixedPatternIfAny(memberId,dayKey,newSchedule){
    const member=team.find(m=>m.id===memberId);
    const {pattern,rangFixed}=getFixedPatterns(memberId,member);
    if(!pattern&&!rangFixed)return false;
    if(pattern==='same'){
      const ref=newSchedule[memberId][dayKey]; // valeur telle que saisie/choisie par l'utilisateur, jamais écrasée
      if(!ref)return false;
      ['mar','mer','jeu','ven','sam'].filter(d=>d!==dayKey&&!(newSchedule[memberId][d]&&newSchedule[memberId][d].horaireManual)).forEach(d=>{newSchedule[memberId][d]={...ref};});
      return true;
    }
    const src=pattern||rangFixed;
    // Une case déjà modifiée à la main (horaireManual) n'est jamais réécrasée par la réapplication du
    // motif fixe déclenchée par l'édition d'un AUTRE jour — l'exception tient pour cette semaine
    // précise, et redevient normale automatiquement la semaine suivante (planning séparé par semaine).
    Object.keys(src).filter(d=>d!==dayKey&&!(newSchedule[memberId][d]&&newSchedule[memberId][d].horaireManual)).forEach(d=>{
      const existing=newSchedule[memberId][d]||{};
      newSchedule[memberId][d]={horaire:src[d],tache:existing.tache||'',alerte:existing.alerte||'',off:false,tacheManual:existing.tacheManual||false};
    });
    return true;
  }

  function saveCell(memberId,dayKey,horaire,tache,alerte){
    if(readOnly)return;
    const newSchedule={...schedule,[memberId]:{...(schedule[memberId]||{}),[dayKey]:{horaire:horaire||'',tache:tache||'',alerte:alerte||'',off:false,tacheManual:!!tache,horaireManual:!!horaire}}};
    const member=team.find(m=>m.id===memberId);
    let nextPending=null;
    if(applyFixedPatternIfAny(memberId,dayKey,newSchedule)){
      // motif fixe (horaire) déjà appliqué à toute la semaine
    }else if(dayKey==='mar'&&plnIsMarLinkedMember(member)&&horaire){
      const letter=plnHoraireLetter(horaire);
      if(letter){
        const cfg=getCommisLetterConfig(letter);
        const merExisting=newSchedule[memberId]['mer']||{};
        const jeuExisting=newSchedule[memberId]['jeu']||{};
        // Une case déjà personnalisée à la main (horaireManual) n'est plus jamais écrasée par la
        // ressaisie du mardi — seule la case en question (mardi) change.
        if(!merExisting.horaireManual)newSchedule[memberId]['mer']={horaire:cfg.merJeu,tache:merExisting.tache||'',alerte:merExisting.alerte||'',off:false};
        if(!jeuExisting.horaireManual)newSchedule[memberId]['jeu']={horaire:cfg.merJeu,tache:jeuExisting.tache||'',alerte:jeuExisting.alerte||'',off:false};
        const autoExisting=newSchedule[memberId][cfg.longDay]||{};
        if(!autoExisting.horaireManual)newSchedule[memberId][cfg.longDay]={horaire:cfg.long,tache:autoExisting.tache||'',alerte:autoExisting.alerte||'',off:false};
        const otherDay=cfg.longDay==='ven'?'sam':'ven';
        if(!(newSchedule[memberId][otherDay]&&newSchedule[memberId][otherDay].horaireManual)){
          nextPending={memberId,dayKey:otherDay,memberName:member.name};
        }
      }
    }
    if(isRangRotationRole(member)&&['mar','mer','jeu'].includes(dayKey)&&tache&&RANG_TACHE_CYCLE.includes(tache)){
      applyRangTacheCascade(newSchedule,dayKey,memberId,tache);
    }
    commit({schedule:newSchedule});
    setOpenEditor(null);
    if(nextPending)setPendingChoiceQueue(q=>[...q,nextPending]);
  }
  function setOff(memberId,dayKey){
    if(readOnly)return;
    const newSchedule={...schedule,[memberId]:{...(schedule[memberId]||{}),[dayKey]:{off:true}}};
    commit({schedule:newSchedule});
    setOpenEditor(null);
  }
  function saveNote(dayKey,text){
    if(readOnly)return;
    commit({notes:{...notes,[dayKey]:text}});
    setOpenEditor(null);
  }
  // Déduit l'horaire d'un jour selon la même logique de répétition que la saisie normale
  // (motif fixe, ou règle mardi->autres jours), à partir de l'horaire du mardi en place.
  function deriveHoraireForDay(memberId,dayKey){
    const member=team.find(m=>m.id===memberId);
    if(!member)return '';
    const {pattern,rangFixed}=getFixedPatterns(memberId,member);
    if(pattern==='same'){
      const days=['mar','mer','jeu','ven','sam'];
      const ref=days.map(d=>schedule[memberId]&&schedule[memberId][d]).find(c=>c&&c.horaire);
      return (ref&&ref.horaire)||'';
    }
    const src=pattern||rangFixed;
    if(src)return src[dayKey]||'';
    const marCell=schedule[memberId]&&schedule[memberId]['mar'];
    const marHoraire=(marCell&&marCell.horaire)||'';
    if(plnIsMarLinkedMember(member)){
      if(!marHoraire)return '';
      const letter=plnHoraireLetter(marHoraire);
      if(!letter)return marHoraire;
      const cfg=getCommisLetterConfig(letter);
      if(dayKey==='mer'||dayKey==='jeu')return cfg.merJeu;
      if(dayKey===cfg.longDay)return cfg.long;
      return ''; // l'autre jour (ven ou sam) est laissé au choix manuel, jamais déduit automatiquement
    }
    return marHoraire; // repli : aucune règle connue pour cette personne
  }

  function toggleDay(dayKey){
    if(readOnly)return;
    const wasOpen=!!dayOpen[dayKey];
    const newSchedule={...schedule};
    if(wasOpen){
      // Fermeture : on vide l'horaire de ce jour pour tout le monde
      team.forEach(m=>{
        newSchedule[m.id]={...(newSchedule[m.id]||{}),[dayKey]:{horaire:'',tache:'',alerte:'',off:false}};
      });
    }else{
      // Ouverture : on déduit l'horaire via la logique de répétition enregistrée (motif fixe
      // ou règle mardi -> autre jour), pas une simple recopie littérale du mardi.
      team.forEach(m=>{
        const horaire=deriveHoraireForDay(m.id,dayKey);
        newSchedule[m.id]={...(newSchedule[m.id]||{}),[dayKey]:{horaire,tache:'',alerte:'',off:false}};
      });
    }
    commit({dayOpen:{...dayOpen,[dayKey]:!dayOpen[dayKey]},schedule:newSchedule});
  }
  function pickChoice(val){
    saveCell(pendingChoice.memberId,pendingChoice.dayKey,val,'','');
    setPendingChoiceQueue(q=>q.slice(1));
  }

  function openCellEditor(memberId,dayKey){
    if(readOnly)return;
    const c=getCell(memberId,dayKey);
    setEditDraft({horaire:(c&&c.horaire)||'',tache:(c&&c.tache)||'',alerte:(c&&c.alerte)||''});
    setOpenEditor({memberId,dayKey});
  }
  function openNoteEditor(dayKey){
    if(readOnly)return;
    setEditDraft({horaire:notes[dayKey]||'',tache:'',alerte:''});
    setOpenEditor({note:true,dayKey});
  }
  function closeEditor(){
    setOpenEditor(null);
  }

  // dividers automatiques
  function computeDividers(){
    const levels=[];
    for(let i=0;i<team.length;i++){
      if(i===team.length-1){levels.push(2);continue;}
      const a=team[i],b=team[i+1];
      let level;
      if(b.group!==a.group)level=2;
      else if(b.role!==a.role)level=1;
      else level=0;
      // 1er Commis : trait épais vers les Chef/Cheffe de rang au-dessus, trait fin vers les Commis en dessous.
      if(b.role==='1er Commis')level=2;
      if(a.role==='1er Commis')level=1;
      levels.push(level);
    }
    return levels;
  }
  function computeRoleSpans(dividers){
    const spans={};
    let i=0;
    while(i<team.length){
      let j=i;
      while(j+1<team.length&&team[j+1].role===team[i].role&&dividers[j]===0)j++;
      spans[team[i].id]={span:j-i+1,skip:false,endIdx:j};
      for(let k=i+1;k<=j;k++)spans[team[k].id]={span:0,skip:true};
      i=j+1;
    }
    return spans;
  }


  const dividers=computeDividers();
  const roleSpans=computeRoleSpans(dividers);

  // gestion équipe
  function ensureRoleKnown(role){
    if(role&&!knownRoles.includes(role))commit({knownRoles:[...knownRoles,role]});
  }
  function moveIntoGroupBlock(newTeam,id){
    const idx=newTeam.findIndex(x=>x.id===id);
    if(idx<0)return newTeam;
    const member=newTeam[idx];
    const rest=newTeam.filter((x,i)=>i!==idx);
    let insertAt=-1;
    for(let i=0;i<rest.length;i++){if(rest[i].group===member.group)insertAt=i;}
    if(insertAt===-1)rest.push(member);
    else rest.splice(insertAt+1,0,member);
    return rest;
  }
  // Chaque action ci-dessous écrit immédiatement, via une transaction qui relit la version la plus
  // fraîche du serveur juste avant d'écrire — donc jamais de risque d'écraser ce qu'un autre appareil
  // aurait changé entre-temps sur quelqu'un d'autre.
  function updateMember(id,field,value){
    updateTeamTransactional(freshTeam=>{
      let newTeam=freshTeam.map(m=>m.id===id?{...m,[field]:value}:m);
      if(field==='group')newTeam=moveIntoGroupBlock(newTeam,id);
      return newTeam;
    });
  }
  function moveMember(i,dir){
    // Échange basé sur l'identité des deux membres (pas leur position), au cas où la liste côté
    // serveur aurait changé entre-temps.
    const a=team[i],b=team[i+dir];
    if(!a||!b)return;
    updateTeamTransactional(freshTeam=>{
      const ia=freshTeam.findIndex(m=>m.id===a.id);
      const ib=freshTeam.findIndex(m=>m.id===b.id);
      if(ia<0||ib<0)return freshTeam;
      const newTeam=[...freshTeam];
      [newTeam[ia],newTeam[ib]]=[newTeam[ib],newTeam[ia]];
      return newTeam;
    });
  }
  function removeMember(id){
    setPendingRemoveId(id);
    setPendingRemoveDate('');
  }
  function confirmRemoveMember(){
    if(!pendingRemoveId||!pendingRemoveDate)return;
    const id=pendingRemoveId,dateFin=pendingRemoveDate;
    updateTeamTransactional(freshTeam=>freshTeam.map(m=>m.id===id?{...m,dateFin}:m));
    setPendingRemoveId(null);setPendingRemoveDate('');
  }
  const addMemberBtnRef=useRef(null);
  function addMember(){
    const id='membre_'+Date.now();
    updateTeamTransactional(freshTeam=>[...freshTeam,{id,name:'Nouveau',role:'',group:'_unset',dateDebut:dateKey(businessNow())}]);
    // La nouvelle ligne apparaît juste au-dessus de ce bouton — sans ça, sur une équipe de 18-19
    // personnes, elle atterrit hors écran et donne l'impression que rien ne s'est passé.
    setTimeout(()=>{addMemberBtnRef.current&&addMemberBtnRef.current.scrollIntoView({behavior:'smooth',block:'center'});},50);
  }



  async function exportAsImage(){
    setOpenEditor(null);setManageOpen(false);setExporting(true);
    const prevZoom=zoomLevel;
    if(prevZoom!==1){
      setZoomLevel(1);
      // laisse React re-rendre à 100% et le navigateur recalculer la mise en page avant de capturer
      await new Promise(res=>requestAnimationFrame(()=>requestAnimationFrame(res)));
    }
    const wrapper=wrapperRef.current;
    const table=tableRef.current;
    const prevOverflow=wrapper?wrapper.style.overflow:null;
    const prevScrollLeft=wrapper?wrapper.scrollLeft:0;
    const toggles=table?table.querySelectorAll('.pln-daytoggle'):[];
    const prevToggleDisplay=[];
    toggles.forEach(t=>{prevToggleDisplay.push(t.style.display);t.style.display='none';});
    if(wrapper){wrapper.style.overflow='visible';wrapper.scrollLeft=0;}
    // Recalcule et réapplique directement les traits juste avant la capture : les mutations
    // ci-dessus (overflow, scroll, zoom) peuvent décaler la mise en page après le dernier
    // rendu React, donc on ne se fie pas à l'état React pour ce dernier ajustement.
    if(wrapper&&table){
      const wrapperRect=wrapper.getBoundingClientRect();
      const width=table.scrollWidth;
      const currentDividers=computeDividers();
      team.forEach((member,idx)=>{
        const level=currentDividers[idx];
        const rowEl=rowRefs.current[idx];
        const lineEl=wrapper.querySelector('[data-divider-line="'+idx+'"]');
        if(level>0&&rowEl&&lineEl){
          const rect=rowEl.getBoundingClientRect();
          lineEl.style.top=Math.round(rect.bottom-wrapperRect.top+wrapper.scrollTop-1)+'px';
          lineEl.style.width=width+'px';
        }
      });
    }
    let dataUrl=null,blob=null;
    try{
      const canvas=await window.html2canvas(wrapper,{backgroundColor:'#ffffff',scale:3,width:wrapper.scrollWidth,windowWidth:wrapper.scrollWidth});
      dataUrl=canvas.toDataURL('image/png');
      blob=await new Promise(res=>canvas.toBlob(res,'image/png'));
      setExportImg(dataUrl);
      setExportBlob(blob);
    }catch(e){console.error(e);}
    toggles.forEach((t,i)=>{t.style.display=prevToggleDisplay[i];});
    if(wrapper){wrapper.style.overflow=prevOverflow;wrapper.scrollLeft=prevScrollLeft;}
    if(prevZoom!==1)setZoomLevel(prevZoom);
    setExporting(false);
    return {dataUrl,blob};
  }

  async function shareImage(){

    if(navigator.canShare && navigator.canShare({files:[file]})){

  function plnFormatDMY(dt){return String(dt.getDate()).padStart(2,'0')+'/'+String(dt.getMonth()+1).padStart(2,'0')+'/'+String(dt.getFullYear()).slice(-2);}

  async function handleSave(){

    if(canArchive)saveArchiveEntry(); // crée l'archive en parallèle
  }

  async function saveArchiveEntry(){
    if(!canArchive)return;
    const fb=getFirebase();
    const dates=plnGetWeekDates(startDateISO);
    const label='Planning du '+plnFormatDMY(dates[0])+' au '+plnFormatDMY(dates[dates.length-1]);
    if(!fb){setArchiveError('Firebase indisponible : la sauvegarde ne peut pas se connecter.');return;}
    try{
      const ref=fb.doc(fb.db,'planning_archive',startDateISO);
      await fb.setDoc(ref,{startDateISO,endDateISO:plnISO(dates[dates.length-1]),label,planning:{team,schedule,dayOpen,notes,knownRoles},savedAt:new Date().toISOString()});
      setArchiveSaved(true);
      setTimeout(()=>setArchiveSaved(false),2500);
    }catch(e){
      console.error(e);
      setArchiveError('Échec de la sauvegarde : '+(e&&e.message||e));
      setTimeout(()=>setArchiveError(null),6000);
    }
  }

  async function loadArchive(){
    setArchiveLoading(true);
    const fb=getFirebase();
    if(!fb){setArchiveLoading(false);return;}

      const col=fb.collection(fb.db,'planning_archive');

  function groupArchiveByMonth(items){
    const m={};items.forEach(it=>{const k=it.startDateISO?it.startDateISO.slice(0,7):'';if(!m[k])m[k]=[];m[k].push(it);});
    return Object.entries(m).sort((a,b)=>b[0].localeCompare(a[0]));
  }
  async function deleteArchiveEntry(startISO){

    catch(e){console.error(e);}

  function viewArchiveEntry(entry){

    setShowArchive(false);
  }
  function loadArchiveEntry(entry){

    commit(entry.planning); // ne touche pas à startDateISO : garde la date déjà choisie pour la nouvelle semaine
    setShowArchive(false);

  const z=zoomLevel;
  const cellStyle={fontSize:Math.round(11.5*z*10)/10,lineHeight:1.35,textAlign:'center',verticalAlign:'middle',cursor:'pointer',padding:Math.round(8*z)+'px '+Math.round(6*z)+'px',position:'relative',minWidth:Math.round(240*z),whiteSpace:'pre-line'};
  const roleColW=Math.round(120*z),nameColW=Math.round(100*z);
  const weekDates=plnGetWeekDates(startDateISO);
  const monthReminder=plnMonthReminder(weekDates);
  function mod(a,m){return ((a%m)+m)%m;}
  function buildAutoWeekSchedule(weeksDiff,newStartISO){
    const newSchedule={};
    const pendingList=[];
    const cheffeShift=mod(weeksDiff,3);
    const commisToggle=mod(weeksDiff,2)!==0;
    const dayList=['mar','mer','jeu'];
    const relevantTeam=team.filter(m=>!(m.dateFin&&m.dateFin<newStartISO)); // exclut ceux dont le dernier jour est déjà passé avant le début de cette nouvelle semaine (sinon ils étaient recopiés sans vérification)
    relevantTeam.forEach(member=>{
      const oldCell=(d)=>(schedule[member.id]&&schedule[member.id][d])||{};
      const {pattern:fixedPattern,rangFixed}=getFixedPatterns(member.id,member);
      const cell={};
      if(fixedPattern==='same'){
        const days=['mar','mer','jeu','ven','sam'];
        const ref=days.map(oldCell).find(c=>c&&c.horaire);
        const val=(ref&&ref.horaire)||'';
        days.forEach(d=>{cell[d]={horaire:val,tache:'',alerte:'',off:false};});
      }else if(fixedPattern||rangFixed){
        const src=fixedPattern||rangFixed;
        if(isRangRotationRole(member)){
          // Cheffe/Chef de rang : horaire fixe, la tâche tourne d'un cran par semaine (décalage cumulé)
          const oldTaches={mar:oldCell('mar').tache||'',mer:oldCell('mer').tache||'',jeu:oldCell('jeu').tache||''};
          dayList.forEach((d,i)=>{
            const sourceDay=dayList[mod(i+cheffeShift,3)];
            cell[d]={horaire:src[d],tache:oldTaches[sourceDay],alerte:'',off:false};
          });
          cell.ven={horaire:src.ven,tache:'',alerte:'',off:false};
          cell.sam={horaire:src.sam,tache:'',alerte:'',off:false};
        }else{
          // ex : Maxime (1er Commis) garde sa tâche fixe (MEP Meuble), elle ne tourne pas
          Object.keys(src).forEach(d=>{cell[d]={horaire:src[d],tache:oldCell(d).tache||'',alerte:'',off:false};});
        }
      }else if(plnIsMarLinkedMember(member)){
        // Commis / Stagiaires salle : la nouvelle semaine démarre sur la lettre INVERSE de celle du
        // samedi de la semaine précédente (dernier jour travaillé), déduite du texte réellement en
        // place plutôt que d'un diff de semaines — donc ça ne peut plus rester bloqué si une case a
        // un jour contenu un texte qui ne correspond plus exactement à l'ancien motif.
        const hadPrevWeek=!!(oldCell('mar').horaire||oldCell('mer').horaire||oldCell('jeu').horaire||oldCell('ven').horaire||oldCell('sam').horaire);
        if(hadPrevWeek){
          const prevSamLetter=plnHoraireLetter(oldCell('sam').horaire);
          const startLetter=prevSamLetter?(prevSamLetter==='G'?'F':'G'):(commisToggle?'F':'G');
          const cfg=getCommisLetterConfig(startLetter);
          cell.mar={horaire:cfg.mar,tache:'',alerte:'',off:false};
          cell.mer={horaire:cfg.merJeu,tache:'',alerte:'',off:false};
          cell.jeu={horaire:cfg.merJeu,tache:'',alerte:'',off:false};
          cell[cfg.longDay]={horaire:cfg.long,tache:'',alerte:'',off:false};
          const otherDay=cfg.longDay==='ven'?'sam':'ven';
          pendingList.push({memberId:member.id,dayKey:otherDay,memberName:member.name});
        }
      }else{
        ['mar','mer','jeu','ven','sam'].forEach(d=>{
          const old=oldCell(d);
          if(old&&old.horaire)cell[d]={horaire:old.horaire,tache:old.tache||'',alerte:'',off:false};
        });
      }
      newSchedule[member.id]=cell;
    });
    return {schedule:newSchedule,pendingList,relevantTeam};
  }

  function applyAutoWeek(newStartISO,weeksDiff){
    const {schedule:autoSchedule,pendingList,relevantTeam}=buildAutoWeekSchedule(weeksDiff,newStartISO);
    commit({startDateISO:newStartISO,schedule:autoSchedule,notes:{},team:relevantTeam});
    if(pendingList.length>0)setPendingChoiceQueue(pendingList);
  }
  async function loadPlanningForDate(newStartISO){
    const fb=getFirebase();
    const weeksDiff=Math.round((new Date(newStartISO+'T00:00:00')-new Date(startDateISO+'T00:00:00'))/(7*24*3600*1000));
    if(!fb){applyAutoWeek(newStartISO,weeksDiff);return;}
    try{
      const ref=fb.doc(fb.db,'planning_archive',newStartISO);
      const snap=await fb.getDoc(ref);
      if(snap.exists()&&snap.data().planning){
        const loaded=snap.data().planning;
        // L'équipe (noms, rôles, genres) n'est PLUS reprise depuis l'archive de cette semaine : c'est
        // une donnée globale toujours à jour, pas un instantané figé à la date de sauvegarde de cette
        // semaine précise. On ne garde de l'archive que le planning (schedule/notes/dayOpen), et on
        // filtre l'équipe ACTUELLE selon qui était présent cette semaine-là (date de fin).
        const filteredTeam=team.filter(m=>!(m.dateFin&&m.dateFin<newStartISO));
        commit({...loaded,team:filteredTeam,startDateISO:newStartISO});
      }else{
        applyAutoWeek(newStartISO,weeksDiff);
      }
    }catch(e){
      console.error('Chargement automatique de la semaine échoué :',e);
      applyAutoWeek(newStartISO,weeksDiff);
    }
  }

    if(readOnly)return;

  async function readOnlyNavigateWeek(direction){
    const fb=getFirebase();if(!fb)return;
    setRoNavMsg('');
    const base=new Date(startDateISO+'T00:00:00');
    base.setDate(base.getDate()+direction*7);
    const targetISO=plnISO(base);
    if(targetISO>getMondayISO(new Date())){
      setRoNavMsg("Les semaines futures ne sont pas consultables.");
      return;
    }
    try{
      const ref=fb.doc(fb.db,'planning_archive',targetISO);
      const snap=await fb.getDoc(ref);
      if(snap.exists()&&snap.data().planning){
        setPreviewEntry({planning:snap.data().planning,startDateISO:targetISO,label:snap.data().label||targetISO});
      }else{
        setRoNavMsg("Aucune archive pour cette semaine.");
      }
    }catch(e){console.error('Navigation lecture seule échouée :',e);setRoNavMsg("Erreur de chargement.");}
  }
  function onDateDebutChange(val){
    if(readOnly)return;
    if(!val)return;

  function onDateFinChange(val){
    if(readOnly)return;

    loadPlanningForDate(plnISO(start));
  }

    if(e.touches.length===2){

      const dx=e.touches[1].clientX-e.touches[0].clientX,dy=e.touches[1].clientY-e.touches[0].clientY;
      pinchZoomRef.current={active:true,startDist:Math.sqrt(dx*dx+dy*dy),startZoom:zoomLevel};
    }

  function onWrapperTouchMove(e){

      e.preventDefault();
      const dx=e.touches[1].clientX-e.touches[0].clientX,dy=e.touches[1].clientY-e.touches[0].clientY;
      const dist=Math.sqrt(dx*dx+dy*dy);
      const next=pinchZoomRef.current.startZoom*(dist/pinchZoomRef.current.startDist);
      setZoomLevel(Math.max(0.5,Math.min(1.2,Math.round(next*100)/100)));

// Suggestion de date selon service et date du jour
const SVC_DAY_MAP={'mar-d':2,'mar-dj':2,'mar-d-next':2,'mer-d':3,'mer-dj':3,'mer-d-next':3,'jeu-d':4,'jeu-dj':4,'jeu-d-next':4,'ven-dj':5,'ven-d':5,'ven-dj-next':5,'ven-d-next':5,'sam-dj':6,'sam-d':6,'sam-dj-next':6,'sam-d-next':6,'dim-dj':0,'dim-d':0};
// Le "jour" bascule à 3h du matin plutôt qu'à minuit (service qui déborde après minuit).
function businessNow(){
  const d=new Date();
  if(d.getHours()<3)d.setDate(d.getDate()-1);
  return d;
}
function suggestDateForSvc(svcId){
  const now=businessNow();
  const today=now.getDay();
  const target=SVC_DAY_MAP[svcId];
  if(target===undefined)return now;
  let diff=target-today;
  if(diff<0)diff+=7;
  const d=new Date(now);d.setDate(d.getDate()+diff);return d;
}
// Date calendaire réelle d'un service pour la semaine en cours (utilisée pour l'affichage
// "Mardi 11 Dîner" sur les boutons de service). S.nextWeek décale d'une semaine de plus
// (ex : "Mardi suivant"). Retourne null pour les services hors de SVC_DAY_MAP (ex : extras).
function svcRealDate(svc){
  const dow=SVC_DAY_MAP[svc.id];
  if(dow===undefined)return null;
  const monday=new Date(getMondayISO(businessNow())+'T12:00:00');
  let diff=dow-1;if(diff<0)diff+=7; // écart en jours depuis lundi (lundi=1 dans getDay())
  if(svc.nextWeek)diff+=7;
  const d=new Date(monday);d.setDate(monday.getDate()+diff);
  return d;
}
function svcLabelWithDate(svc){
  const d=svcRealDate(svc);
  if(!d)return svc.label;
  const isLunch=svc.id.includes('-dj');
  return PLN_WEEKDAY_NAMES[d.getDay()]+' '+d.getDate()+' '+(isLunch?'Déjeuner':'Dîner');
}
function fmtDateFR(d){return d.toLocaleDateString('fr-FR',{day:'2-digit',month:'2-digit',year:'numeric'});}

// --- Bascule automatique de semaine Carcasse (lundi 3h) ---
// Les 7 services fixes ont chacun une case "suivante" en miroir (voir ALL_POSSIBLE). Au passage
// du lundi réel, les données de chaque case "suivante" remplacent celles de la semaine en cours,
// et la case "suivante" repart sur le gabarit par défaut. Si aucune case "suivante" n'existait pour
// un service donné, la semaine en cours repart quand même à zéro (jamais de données périmées
// conservées). Les extras ponctuels (Mardi Déjeuner, Dimanche Déj/Dîner) n'ont pas de case
// "suivante" et ne sont jamais concernés par ce mécanisme.
const CARCASSE_WEEK_PAIRS=[['mar-d','mar-d-next'],['mer-d','mer-d-next'],['jeu-d','jeu-d-next'],['ven-dj','ven-dj-next'],['ven-d','ven-d-next'],['sam-dj','sam-dj-next'],['sam-d','sam-d-next']];
// Les 7 services "semaine suivante" doivent toujours exister par défaut (miroir exact des 7 services
// de base), pour que l'anticipation à 15 jours soit prête sans jamais avoir à les rajouter à la main.
const NEXT_WEEK_DEFAULT_SERVICES=[
  {id:'mar-d-next',label:'Mardi Dîner',after:'sam-d',nextWeek:true},
  {id:'mer-d-next',label:'Mercredi Dîner',after:'mar-d-next',nextWeek:true},
  {id:'jeu-d-next',label:'Jeudi Dîner',after:'mer-d-next',nextWeek:true},
  {id:'ven-dj-next',label:'Vendredi Déjeuner',after:'jeu-d-next',nextWeek:true},
  {id:'ven-d-next',label:'Vendredi Dîner',after:'ven-dj-next',nextWeek:true},
  {id:'sam-dj-next',label:'Samedi Déjeuner',after:'ven-d-next',nextWeek:true},
  {id:'sam-d-next',label:'Samedi Dîner',after:'sam-dj-next',nextWeek:true},
];
let lastEnsureNextWeekCheck=0;
async function ensureNextWeekServices(){
  const fb=getFirebase();if(!fb)return;
  const now=Date.now();
  if(now-lastEnsureNextWeekCheck<60*1000)return; // au plus une vérification par minute, pour ne pas multiplier les lectures Firestore à chaque snapshot
  lastEnsureNextWeekCheck=now;
  try{
    const ref=fb.doc(fb.db,'app','state');
    await fb.runTransaction(fb.db,async(tx)=>{
      const snap=await tx.get(ref);
      const data=snap.exists()?snap.data():{};
      const services=data.services||[];
      const missing=NEXT_WEEK_DEFAULT_SERVICES.filter(def=>!services.some(s=>s.id===def.id));
      if(missing.length===0)return; // les 7 cases par défaut existent déjà : rien à faire, rien à écrire
      // Pour chaque service manquant, on regarde d'abord si une sauvegarde d'archive existe déjà pour
      // sa date réelle (Sauvegarder l'a peut-être enregistrée avant que le service ne disparaisse) — le
      // nom du document d'archive est prévisible (date + déjeuner/dîner), donc on peut le lire directement.
      // Tous les tx.get doivent se faire avant le moindre tx.update dans une transaction Firestore.
      const archiveSnaps=await Promise.all(missing.map(def=>{
        const d=svcRealDate(def);
        const isLunch=def.id.includes('-dj');
        const archiveRef=fb.doc(fb.db,'carcasse_archive',dateKey(d)+'_'+(isLunch?'dj':'d'));
        return tx.get(archiveRef);
      }));
      const ds=data.defaultSettings||{};
      const newServices=[...services];
      const patch={};
      missing.forEach((def,idx)=>{
        const targetPos=ORDER.indexOf(def.id);
        let insertAt=newServices.length;
        for(let i=0;i<newServices.length;i++){if(ORDER.indexOf(newServices[i].id)>targetPos){insertAt=i;break;}}
        newServices.splice(insertAt,0,{id:def.id,label:def.label,extra:true,nextWeek:true});
        const archived=archiveSnaps[idx].exists()?archiveSnaps[idx].data():null;
        if(archived){
          patch['tables.'+def.id]=archived.tableData||buildDefault([{id:def.id}],ds.defSalle,ds.defTerrasse)[def.id];
          patch['terrasseMode.'+def.id]=!!archived.terrasseMode;
          patch['manual.'+def.id]={pax:archived.pax??null,tables:archived.tablesCount??null};
          patch['gpData.'+def.id]=archived.gp||null;
        }else{
          patch['tables.'+def.id]=buildDefault([{id:def.id}],ds.defSalle,ds.defTerrasse)[def.id];
          patch['terrasseMode.'+def.id]=false;
          patch['manual.'+def.id]={};
        }
        patch['compos.'+def.id]=buildEmptyCompo(); // la composition (personnel par table) n'est pas dans l'archive Carcasse : elle reste vide même si les tables sont restaurées
      });
      patch['services']=newServices;
      tx.update(ref,patch);
    });
  }catch(e){console.error('Auto-restauration des services "semaine suivante" échouée :',e);}
}

async function maybeRolloverCarcasseWeek(latestData){
  const fb=getFirebase();if(!fb)return;
  const nowMonday=getMondayISO(businessNow());
  if(latestData.carcasseRolloverMonday===nowMonday)return; // déjà fait pour cette semaine, rien à vérifier (évite une transaction inutile à chaque snapshot)
  try{
    await fb.runTransaction(fb.db,async(tx)=>{
      const ref=fb.doc(fb.db,'app','state');
      const snap=await tx.get(ref);
      const data=snap.exists()?snap.data():{};
      if(data.carcasseRolloverMonday===nowMonday)return; // un autre appareil a déjà traité la bascule entre-temps
      if(data.carcasseRolloverMonday===undefined){
        // Premier passage de ce mécanisme : on adopte le lundi courant comme référence sans rien
        // transférer, pour éviter une bascule surprise le jour du déploiement (quel que soit le jour réel).
        tx.update(ref,{carcasseRolloverMonday:nowMonday});
        return;
      }
      const svcList=data.services||[];
      const ds=data.defaultSettings||{};
      const newTables={...(data.tables||{})};
      const newManual={...(data.manual||{})};
      const newTerrasse={...(data.terrasseMode||{})};
      const newGp={...(data.gpData||{})};
      const newCompos={...(data.compos||{})};
      CARCASSE_WEEK_PAIRS.forEach(([baseId,nextId])=>{
        const nextExists=svcList.some(s=>s.id===nextId);
        if(nextExists){
          newTables[baseId]=dc(newTables[nextId]||buildDefault([{id:nextId}],ds.defSalle,ds.defTerrasse)[nextId]);
          newManual[baseId]=dc(newManual[nextId]||{});
          newTerrasse[baseId]=!!newTerrasse[nextId];
          newGp[baseId]=newGp[nextId]?dc(newGp[nextId]):null;
          newCompos[baseId]=newCompos[nextId]?dc(newCompos[nextId]):buildEmptyCompo();
          newTables[nextId]=buildDefault([{id:nextId}],ds.defSalle,ds.defTerrasse)[nextId];
          newManual[nextId]={};
          newTerrasse[nextId]=false;
          newGp[nextId]=null;
          newCompos[nextId]=buildEmptyCompo();
        }else{
          newTables[baseId]=buildDefault([{id:baseId}],ds.defSalle,ds.defTerrasse)[baseId];
          newManual[baseId]={};
          newTerrasse[baseId]=false;
          newGp[baseId]=null;
          newCompos[baseId]=buildEmptyCompo();
        }
      });
      tx.update(ref,{tables:newTables,manual:newManual,terrasseMode:newTerrasse,gpData:newGp,compos:newCompos,carcasseRolloverMonday:nowMonday});
    });
  }catch(e){console.error('Bascule automatique Carcasse échouée :',e);}
}
// Clé locale (et non UTC) : évite le décalage d'un jour près de minuit, cohérent avec fmtDateFR.
function dateKey(d){
  const y=d.getFullYear();
  const m=String(d.getMonth()+1).padStart(2,'0');
  const day=String(d.getDate()).padStart(2,'0');
  return y+'-'+m+'-'+day;
}

// Semaine métier : mardi → lundi (7 jours). Renvoie la clé (date du mardi) pour une date donnée.
function weekKeyFor(dstr){
  const d=new Date(dstr+'T12:00:00');
  const dow=d.getDay();
  const sinceTue=(dow+7-2)%7;
  const start=new Date(d);start.setDate(start.getDate()-sinceTue);
  return dateKey(start);
}
function weekLabelFor(weekKeyStr){
  const start=new Date(weekKeyStr+'T12:00:00');
  const end=new Date(start);end.setDate(end.getDate()+6);
  return 'Semaine du '+fmtDateFR(start)+' au '+fmtDateFR(end);
}
async function fetchWeekOptions(){
  const fb=getFirebase();if(!fb)return[];
  try{
    const col=fb.collection(fb.db,'linge');
    const snap=await fb.getDocs(col);
    const items=[];snap.forEach(d=>items.push(d.data()));
    const byWeek={};
    items.forEach(it=>{
      if(!it.date)return;
      const wk=weekKeyFor(it.date);
      if(!byWeek[wk])byWeek[wk]=[];
      byWeek[wk].push(it);
    });
    return Object.entries(byWeek).map(([wk,entries])=>({weekKey:wk,label:weekLabelFor(wk),entries})).sort((a,b)=>b.weekKey.localeCompare(a.weekKey));
  }catch(e){console.error(e);return[];}
}
function buildWeekValsShared(entries,lingeItems){
  const v={};
  lingeItems.blanchisseur.forEach(it=>{v[it.id]={dj:0,dn:0};});
  lingeItems.elis.forEach(it=>{v[it.id]={dj:0,dn:0};});
  entries.forEach(entry=>{
    const ev=entry.vals||{};
    const isDj=!!(entry.svcId&&entry.svcId.includes('-dj'));
    Object.keys(v).forEach(itemId=>{
      const cell=ev[itemId];if(cell==null)return;
      const raw=(typeof cell==='object')?(isDj?cell.dj:cell.dn):cell;
      const n=parseInt(raw)||0;
      if(isDj)v[itemId].dj+=n;else v[itemId].dn+=n;
    });
  });
  const out={};
  Object.entries(v).forEach(([k,val])=>{out[k]={dj:val.dj?String(val.dj):'',dn:val.dn?String(val.dn):''};});
  return out;
}

// Calcule nappes depuis carcasse (hors AQUA)
function calcNappesFromCarcasse(svcData){
  const cnt={180:0,200:0,220:0,260:0,280:0};
  [...SALLE,...TERRASSE].forEach(tn=>{
    if(tn==='AQUA')return;
    const d=svcData[tn];
    if(d&&d.covers>0&&d.plateau&&LINGE_NAPPE_MAP[d.plateau])cnt[LINGE_NAPPE_MAP[d.plateau]]++;
  });
  return cnt;
}

  function moveItem(section,idx,dir){
    const newL=dc(localLinge);
    const arr=newL[section];
    const newIdx=idx+dir;
    if(newIdx<0||newIdx>=arr.length)return;
    [arr[idx],arr[newIdx]]=[arr[newIdx],arr[idx]];
    setLocalLinge(newL);
  }
  function deleteItem(section,idx){
    const newL=dc(localLinge);
    newL[section].splice(idx,1);
    setLocalLinge(newL);

    if(!newItemLabel.trim())return;
    const newL=dc(localLinge);

    setLocalLinge(newL);
    setNewItemLabel('');setNewItemNappe('');

    const fb=getFirebase();
    let otherVals={};

const CAISSE_BILLETS=[500,200,100,50,20,10,5];
const CAISSE_PIECES=[2,1];
const CAISSE_ROULEAUX=[2,1]; // un rouleau = 25 pièces de cette dénomination
const CAISSE_FOND_DEFAUT=1500;
function fmtEuro(n){return (Math.round((n+Number.EPSILON)*100)/100).toLocaleString('fr-FR',{minimumFractionDigits:2,maximumFractionDigits:2})+' €';}
function emptyCaisseVals(){
  const v={billets:{},pieces:{},rouleaux:{},montantAVerser:'',fond:String(CAISSE_FOND_DEFAUT)};
  CAISSE_BILLETS.forEach(d=>v.billets[d]='');
  CAISSE_PIECES.forEach(d=>v.pieces[d]='');
  CAISSE_ROULEAUX.forEach(d=>v.rouleaux[d]='');
  return v;
}
function normalizeCaisseVals(saved){
  const v=emptyCaisseVals();
  if(!saved)return v;
  CAISSE_BILLETS.forEach(d=>{if(saved.billets?.[d]!==undefined)v.billets[d]=saved.billets[d];});
  CAISSE_PIECES.forEach(d=>{if(saved.pieces?.[d]!==undefined)v.pieces[d]=saved.pieces[d];});
  CAISSE_ROULEAUX.forEach(d=>{if(saved.rouleaux?.[d]!==undefined)v.rouleaux[d]=saved.rouleaux[d];});
  v.montantAVerser=saved.montantAVerser??'';
  v.fond=saved.fond??String(CAISSE_FOND_DEFAUT);
  return v;
}
function computeCaisseTotals(vals){
  const n=x=>{const p=parseFloat(String(x).replace(',','.'));return isNaN(p)?0:p;};
  let billetsTotal=0;CAISSE_BILLETS.forEach(d=>billetsTotal+=n(vals.billets[d])*d);
  let piecesTotal=0;CAISSE_PIECES.forEach(d=>piecesTotal+=n(vals.pieces[d])*d);
  let rouleauxTotal=0;CAISSE_ROULEAUX.forEach(d=>rouleauxTotal+=n(vals.rouleaux[d])*d*25);
  const total=billetsTotal+piecesTotal+rouleauxTotal;
  const fond=n(vals.fond);
  const montantAVerser=n(vals.montantAVerser);
  const ecart=total-montantAVerser-fond;
  return{billetsTotal,piecesTotal,rouleauxTotal,total,fond,montantAVerser,ecart};
}

function CaisseView({userEmail}){
  const [vals,setVals]=useState(null);
  const [syncing,setSyncing]=useState(false);
  const caisseSaveTimersRef=useRef({});
  const caissePendingRef=useRef(0);
  const containerRef=useRef(null);

  useEffect(()=>{
    let cancelled=false;
    (async()=>{
      const fb=getFirebase();
      if(!fb){if(!cancelled)setVals(emptyCaisseVals());return;}
      try{
        const ref=fb.doc(fb.db,'caisse','main');
        const snap=await fb.getDoc(ref);
        if(cancelled)return;
        if(snap.exists()&&snap.data().vals){setVals(normalizeCaisseVals(snap.data().vals));}
        else{setVals(emptyCaisseVals());}
      }catch(e){if(!cancelled)setVals(emptyCaisseVals());}
    })();
    return()=>{cancelled=true;};
  },[]);

  function autosaveField(fieldPath,value){
    const fb=getFirebase();if(!fb)return;
    caissePendingRef.current++;
    setSyncing(true);
    if(caisseSaveTimersRef.current[fieldPath])clearTimeout(caisseSaveTimersRef.current[fieldPath]);
    caisseSaveTimersRef.current[fieldPath]=setTimeout(async()=>{
      const ref=fb.doc(fb.db,'caisse','main');
      const payload={[fieldPath]:value,savedBy:userEmail,savedAt:new Date().toISOString()};
      try{
        await fb.updateDoc(ref,payload);
      }catch(err){
        // Le document n'existe pas encore : on le crée puis on réapplique le champ précisément.
        try{
          await fb.setDoc(ref,{vals:emptyCaisseVals(),savedBy:userEmail,savedAt:new Date().toISOString()},{merge:true});
          await fb.updateDoc(ref,payload);
        }catch(e2){console.error('Caisse save error',e2);}
      }
      delete caisseSaveTimersRef.current[fieldPath];
      caissePendingRef.current=Math.max(0,caissePendingRef.current-1);
      if(caissePendingRef.current===0)setSyncing(false);
    },600);
  }

  function setField(section,denom,value){
    const clean=String(value).replace(/[^0-9]/g,'');
    setVals(prev=>({...prev,[section]:{...prev[section],[denom]:clean}}));
    autosaveField('vals.'+section+'.'+denom,clean);
  }
  function setTopField(field,value){
    const clean=String(value).replace(/[^0-9]/g,'');
    setVals(prev=>({...prev,[field]:clean}));
    autosaveField('vals.'+field,clean);
  }

  function focusNextCaisseInput(current){
    const inputs=Array.from(containerRef.current?.querySelectorAll('[data-caisse-input]')||[]);
    const idx=inputs.indexOf(current);
    if(idx>-1&&idx<inputs.length-1){inputs[idx+1].focus();}
    else{current.blur();}
  }
  function handleEnterNext(e){
    if(e.key!=='Enter')return;
    e.preventDefault();
    focusNextCaisseInput(e.target);
  }

  const inputStyle={width:'100%',padding:'4px 2px',fontSize:13,fontWeight:600,border:'none',background:'transparent',textAlign:'center',outline:'none',color:'#1a1a1a'};
  const thStyle={fontSize:10,fontWeight:700,color:'#888',textTransform:'uppercase',letterSpacing:'.04em',padding:'6px 8px',textAlign:'center',borderBottom:'1px solid #e5e7eb'};
  const totals=vals?computeCaisseTotals(vals):null;

  return(<div ref={containerRef} style={{display:'flex',flexDirection:'column',gap:10}}>
    <div style={{display:'flex',gap:8,flexWrap:'wrap',alignItems:'center',padding:'8px 12px',background:'#ececea',borderRadius:8,border:'0.5px solid #d4d2c8'}}>
      <span style={{fontSize:13,fontWeight:500}}>Caisse</span>
      <div style={{flex:1}}/>
      <span style={{fontSize:11,color:syncing?'#b45309':'#22c55e'}}>{syncing?'Sync…':'Enregistré'}</span>
    </div>

    {vals&&totals&&(<>
      <div style={{background:'#fff',borderRadius:10,padding:'10px 12px',border:'0.5px solid #d4d2c8'}}>
        <div style={{display:'flex',alignItems:'center',justifyContent:'space-between'}}>
          <span style={{fontSize:13,fontWeight:600,color:'#1a1a1a'}}>Montant à verser</span>
          <input data-caisse-input type="tel" inputMode="numeric" pattern="[0-9]*" enterKeyHint="next" min={0} value={vals.montantAVerser} onChange={e=>setTopField('montantAVerser',e.target.value.replace(/[^0-9]/g,''))} onKeyDown={handleEnterNext} onFocus={e=>e.target.select()} placeholder="0" style={{width:110,padding:'6px 8px',fontSize:15,fontWeight:700,border:'0.5px solid #ccc',borderRadius:6,textAlign:'center',outline:'none'}}/>
        </div>
      </div>

      <div style={{background:'#fff',borderRadius:10,padding:'8px 12px',border:'0.5px solid #d4d2c8'}}>
        <table style={{width:'100%',borderCollapse:'collapse'}}>
          <thead><tr><th style={{...thStyle,textAlign:'left'}}>Devise</th><th style={thStyle}>Quantité</th><th style={thStyle}>Total</th></tr></thead>
          <tbody>
            {CAISSE_BILLETS.map(d=>(<tr key={'b'+d}>
              <td style={{fontSize:12,padding:'4px 8px',borderBottom:'1px solid #ececea'}}>{d}€ (billet)</td>
              <td style={{borderBottom:'1px solid #ececea'}}><input data-caisse-input type="tel" inputMode="numeric" pattern="[0-9]*" enterKeyHint="next" min={0} value={vals.billets[d]} onChange={e=>setField('billets',d,e.target.value.replace(/[^0-9]/g,''))} onKeyDown={handleEnterNext} onFocus={e=>e.target.select()} style={inputStyle}/></td>
              <td style={{fontSize:12,fontWeight:600,textAlign:'center',padding:'4px 8px',borderBottom:'1px solid #ececea'}}>{fmtEuro((parseFloat(vals.billets[d])||0)*d)}</td>
            </tr>))}
            {CAISSE_PIECES.map(d=>(<tr key={'p'+d}>
              <td style={{fontSize:12,padding:'4px 8px',borderBottom:'1px solid #ececea'}}>{d}€ (pièce)</td>
              <td style={{borderBottom:'1px solid #ececea'}}><input data-caisse-input type="tel" inputMode="numeric" pattern="[0-9]*" enterKeyHint="next" min={0} value={vals.pieces[d]} onChange={e=>setField('pieces',d,e.target.value.replace(/[^0-9]/g,''))} onKeyDown={handleEnterNext} onFocus={e=>e.target.select()} style={inputStyle}/></td>
              <td style={{fontSize:12,fontWeight:600,textAlign:'center',padding:'4px 8px',borderBottom:'1px solid #ececea'}}>{fmtEuro((parseFloat(vals.pieces[d])||0)*d)}</td>
            </tr>))}
            {CAISSE_ROULEAUX.map(d=>(<tr key={'r'+d}>
              <td style={{fontSize:12,padding:'4px 8px',borderBottom:'1px solid #ececea'}}>{d}€ (rouleau ×25)</td>
              <td style={{borderBottom:'1px solid #ececea'}}><input data-caisse-input type="tel" inputMode="numeric" pattern="[0-9]*" enterKeyHint="next" min={0} value={vals.rouleaux[d]} onChange={e=>setField('rouleaux',d,e.target.value.replace(/[^0-9]/g,''))} onKeyDown={handleEnterNext} onFocus={e=>e.target.select()} style={inputStyle}/></td>
              <td style={{fontSize:12,fontWeight:600,textAlign:'center',padding:'4px 8px',borderBottom:'1px solid #ececea'}}>{fmtEuro((parseFloat(vals.rouleaux[d])||0)*d*25)}</td>
            </tr>))}
          </tbody>
        </table>
      </div>

      <div style={{background:'#fff',borderRadius:10,padding:'10px 12px',border:'0.5px solid #d4d2c8',display:'flex',flexDirection:'column',gap:8}}>
        <div style={{display:'flex',alignItems:'center',justifyContent:'space-between'}}>
          <span style={{fontSize:12,color:'#555'}}>Fond de référence</span>
          <input data-caisse-input type="tel" inputMode="numeric" pattern="[0-9]*" enterKeyHint="next" min={0} value={vals.fond} onChange={e=>setTopField('fond',e.target.value.replace(/[^0-9]/g,''))} onKeyDown={handleEnterNext} onFocus={e=>e.target.select()} style={{width:100,padding:'4px 6px',fontSize:13,fontWeight:600,border:'0.5px solid #ccc',borderRadius:6,textAlign:'center',outline:'none'}}/>
        </div>
        <div style={{borderTop:'1px solid #ececea',paddingTop:8,display:'flex',flexDirection:'column',gap:4}}>
          <div style={{display:'flex',justifyContent:'space-between',fontSize:13,fontWeight:700}}><span>Total compté</span><span>{fmtEuro(totals.total)}</span></div>
          <div style={{display:'flex',justifyContent:'space-between',fontSize:12,color:'#888'}}><span>Fond</span><span>{fmtEuro(totals.fond)}</span></div>
          <div style={{display:'flex',justifyContent:'space-between',fontSize:13,fontWeight:700,color:totals.ecart<0?'#dc2626':'#166534'}}><span>Écart</span><span>{fmtEuro(totals.ecart)}</span></div>
        </div>
      </div>
    </>)}
  </div>);
}

function ReceptionExport({onClose,dateStr,vals,lingeItems}){
  const outerRef=useRef(null),contentRef=useRef(null);
  const [scale,setScale]=useState(1);
  useEffect(()=>{
    function fit(){if(!outerRef.current||!contentRef.current)return;contentRef.current.style.transform='scale(1)';const aH=outerRef.current.clientHeight-16,aW=outerRef.current.clientWidth-16,cH=contentRef.current.scrollHeight,cW=contentRef.current.scrollWidth;setScale(Math.min(1,aH/cH,aW/cW));}

  return(<div style={{position:'fixed',inset:0,zIndex:300,background:'#f5f4f0',display:'flex',flexDirection:'column',overflow:'hidden'}}>
