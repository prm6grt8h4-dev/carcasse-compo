function LoginScreen(){
  const [email,setEmail]=useState('');
  const [password,setPassword]=useState('');
  const [error,setError]=useState('');
  const [loading,setLoading]=useState(false);

  async function handleLogin(){
    const fb=getFirebase();
    if(!fb){setError('Firebase non initialisé. Rechargez la page.');return;}
    setLoading(true);setError('');
    try{
      await fb.signInWithEmailAndPassword(fb.auth,email,password);
    }catch(e){
      setError('Email ou mot de passe incorrect.');
    }finally{setLoading(false);}
  }

  return(
    <div style={{minHeight:'100vh',background:'#f5f4f0',display:'flex',alignItems:'center',justifyContent:'center',fontFamily:'system-ui,sans-serif'}}>
      <div style={{background:'#fff',borderRadius:16,padding:32,width:320,border:'0.5px solid #d4d2c8',boxShadow:'0 4px 24px rgba(0,0,0,.07)'}}>
        <div style={{textAlign:'center',marginBottom:24}}>
          <img src={APP_LOGO_B64} alt="Le Louis XV" style={{width:140,display:'block',margin:'0 auto 16px',opacity:1}}/>
          </div>
        <div style={{marginBottom:12}}>
          <div style={{fontSize:11,color:'#888',marginBottom:4}}>Email</div>
          <input
            type="email"
            value={email}
            onChange={e=>setEmail(e.target.value)}
            onKeyDown={e=>e.key==='Enter'&&handleLogin()}
            placeholder="votre@email.com"
            style={{width:'100%',padding:'9px 12px',fontSize:13,border:'0.5px solid #ccc',borderRadius:8,boxSizing:'border-box',outline:'none'}}
          />
        </div>
        <div style={{marginBottom:20}}>
          <div style={{fontSize:11,color:'#888',marginBottom:4}}>Mot de passe</div>
          <input
            type="password"
            value={password}
            onChange={e=>setPassword(e.target.value)}
            onKeyDown={e=>e.key==='Enter'&&handleLogin()}
            placeholder="••••••••"
            style={{width:'100%',padding:'9px 12px',fontSize:13,border:'0.5px solid #ccc',borderRadius:8,boxSizing:'border-box',outline:'none'}}
          />
        </div>
        {error&&<div style={{fontSize:12,color:'#dc2626',marginBottom:12,textAlign:'center'}}>{error}</div>}
        <button
          onClick={handleLogin}
          disabled={loading}
          style={{width:'100%',padding:'10px',background:'#1a1a1a',color:'#fff',border:'none',borderRadius:8,fontSize:13,fontWeight:600,cursor:loading?'default':'pointer',opacity:loading?0.6:1}}
        >{loading?'Connexion…':'Se connecter'}</button>
      </div>
    </div>
  );
}

function App(){
  const [authState,setAuthState]=useState('checking');
  const [userEmail,setUserEmail]=useState('');
  const [tab,setTab]=useState('carcasse');
  const [lingeSubTab,setLingeSubTab]=useState('journalier'); // 'journalier' | 'reception'
  const [fromageSubTab,setFromageSubTab]=useState('carte'); // 'compte' | 'carte'
  const [services,setServices]=useState(DEFAULT_SERVICES);
  const [tables,setTables]=useState(()=>buildDefault(DEFAULT_SERVICES));
  const [terrasseMode,setTerrasseMode]=useState(()=>Object.fromEntries(DEFAULT_SERVICES.map(s=>[s.id,false])));
  const [manual,setManual]=useState(()=>Object.fromEntries(DEFAULT_SERVICES.map(s=>[s.id,{}])));
  const [currentService,setCurrentServiceRaw]=useState(()=>{try{return localStorage.getItem('carcasse_currentService_local')||'mar-d';}catch(e){return 'mar-d';}});
  const setCurrentService=useCallback((id)=>{setCurrentServiceRaw(id);try{localStorage.setItem('carcasse_currentService_local',id);}catch(e){}},[]);
  const [compos,setCompos]=useState(()=>Object.fromEntries(DEFAULT_SERVICES.map(s=>[s.id,buildEmptyCompo()])));
  const [team,setTeam]=useState(INITIAL_TEAM);
  const [modal,setModal]=useState(null);
  const [showSvc,setShowSvc]=useState(false);
  const [carcasseWeekView,setCarcasseWeekView]=useState('current'); // filtre d'affichage pur : 'current' ou 'next', ne touche pas à services/currentService
  const [plateauAlert,setPlateauAlert]=useState(null); // liste des dépassements pour le service qu'on vient d'afficher, ou null si aucun
  const [carcasseSavingAll,setCarcasseSavingAll]=useState(false);
  const [carcasseSavedAll,setCarcasseSavedAll]=useState(false);
  const [showCarcasseArchive,setShowCarcasseArchive]=useState(false);
  const [carcasseArchive,setCarcasseArchive]=useState([]);
  const [carcasseArchiveLoading,setCarcasseArchiveLoading]=useState(false);
  const [syncStatus,setSyncStatus]=useState('idle');
  const [syncErrorDetail,setSyncErrorDetail]=useState('');
  const [salleAllOff,setSalleAllOff]=useState(false);
  const [terrasseAllOff,setTerrasseAllOff]=useState(false);
  const [showSettings,setShowSettings]=useState(false);
  const [gpData,setGpData]=useState({}); // Terrasse GP : { [svcId]: {active, tables:[{num,pax,carree,rectangle,chairs}], extra:[{id,type,qty,note}]} }
  const [defaultSettings,setDefaultSettings]=useState({
    defSalle:dc(DEF_SALLE),defTerrasse:dc(DEF_TERRASSE),
    terSalle:dc(TER_SALLE),terTerrasse:dc(TER_TERRASSE),
    plateauRules:dc(DEFAULT_PLATEAU_RULES),
    gpInventory:{carree:0,rectangle:0,chaise:0}
  });
  setPlateauRulesOverride(defaultSettings.plateauRules||DEFAULT_PLATEAU_RULES);
  const [lingeItems,setLingeItems]=useState({
    blanchisseur:dc(BLANCHISSEUR_ITEMS),
    elis:dc(ELIS_ITEMS)
  });
  const [fromageList,setFromageList]=useState(dc(DEFAULT_FROMAGE_LIST));
  const [planning,setPlanning]=useState(()=>dc(DEFAULT_PLANNING));
  const [menuFicheUrl,setMenuFicheUrl]=useState('');
  const saveTimerRef=useRef({});
  const planningSaveTimerRef=useRef(null);
  const planningPendingPatchRef=useRef({});
  const unsubscribeRef=useRef(null);
  const hasLoadedStateRef=useRef(false); // true seulement après la 1ère réception des vraies données Firestore (évite qu'un effet sauvegarde des valeurs par défaut avant leur arrivée)
  const carcasseRolloverMondayRef=useRef(undefined); // dernier repère de bascule Carcasse connu, mis à jour par le listener Firestore
  const roleLinge=isLinge(userEmail);

  // Auth listener
  useEffect(()=>{
    const fb=getFirebase();
    if(!fb){setAuthState('logged-out');return;}
    const unsub=fb.onAuthStateChanged(fb.auth,user=>{
      if(user){setAuthState('logged-in');setUserEmail(user.email||'');}
      else{setAuthState('logged-out');}
    });
    return()=>unsub();
  },[]);

  // Firestore real-time listener (when logged in)
  useEffect(()=>{
    if(authState!=='logged-in')return;
    const fb=getFirebase();
    if(!fb)return;
    const ref=fb.doc(fb.db,'app','state');
    const unsub=fb.onSnapshot(ref,snap=>{
      if(!snap.exists())return;
      const p=snap.data();
      if(p.services?.length>0)setServices(p.services);
      if(p.tables)setTables(p.tables);
      if(p.terrasseMode)setTerrasseMode(p.terrasseMode);
      if(p.manual)setManual(p.manual);
      if(p.compos)setCompos(p.compos);
      ensureNextWeekServices(); // garantit en permanence la présence des 7 services "semaine suivante", sans action manuelle — relit l'état le plus frais à chaque vérification (au plus 1x/minute)
      if(p.gpData)setGpData(p.gpData);
      if(p.team){
        const merged=p.team.map(saved=>{const ini=INITIAL_TEAM.find(m=>m.id===saved.id);return{...saved,gender:saved.gender||(ini?.gender??'m')};});
        setTeam(merged);
      }
      if(p.defaultSettings){
        const savedPR=p.defaultSettings.plateauRules||{};
        setDefaultSettings({
          plateauRules:dc(DEFAULT_PLATEAU_RULES),
          ...p.defaultSettings,
          plateauRules:{...DEFAULT_PLATEAU_RULES,...savedPR,inventory:{...DEFAULT_PLATEAU_RULES.inventory,...(savedPR.inventory||{})}}
        });
      }
      if(p.lingeItems)setLingeItems(p.lingeItems);
      if(p.fromageList)setFromageList(p.fromageList);
      if(p.planning)setPlanning(p.planning);
      if(p.menuFicheUrl!==undefined)setMenuFicheUrl(p.menuFicheUrl);
      hasLoadedStateRef.current=true; // les données réelles sont arrivées : les effets qui pourraient sauvegarder (ex. synchro Planning->Compo) peuvent désormais le faire sans risque d'écraser avec des valeurs par défaut
      setSyncErrorDetail('');
      carcasseRolloverMondayRef.current=p.carcasseRolloverMonday;
      maybeRolloverCarcasseWeek(p); // vérifie si le lundi réel a changé depuis la dernière bascule ; transaction atomique, ne fait rien si déjà à jour
    },(err)=>{console.error('Firestore error',err);setSyncErrorDetail((err&&(err.code||err.message))||'Erreur inconnue (listener)');setSyncStatus('error');});
    unsubscribeRef.current=unsub;
    return()=>{if(unsubscribeRef.current)unsubscribeRef.current();};
  },[authState]);

  // Filet de sécurité pour la bascule Carcasse : le listener ci-dessus ne se redéclenche que sur une
  // écriture Firestore, pas tout seul avec le temps. Si l'app reste ouverte sans rechargement pile au
  // passage de 3h, cette vérification périodique (toutes les 10 min) rattrape le coup.
  useEffect(()=>{
    if(authState!=='logged-in')return;
    const id=setInterval(()=>{maybeRolloverCarcasseWeek({carcasseRolloverMonday:carcasseRolloverMondayRef.current});},10*60*1000);
    return()=>clearInterval(id);
  },[authState]);

  // Planning de la semaine RÉELLEMENT en cours (basé sur la date du jour), indépendant de la
  // semaine actuellement affichée/éditée dans l'onglet Planning (qui peut être une semaine
  // future préparée à l'avance). La Compo doit toujours se baser sur celui-ci.
  const [compoPlanning,setCompoPlanning]=useState(null);
  const [compoPlanningStatus,setCompoPlanningStatus]=useState('loading'); // 'loading' | 'ok' | 'empty' | 'error:<detail>'
  useEffect(()=>{
    let cancelled=false;
    async function loadCurrentWeekForCompo(){
      const todayMonday=getMondayISO(new Date());
      // Si la semaine actuellement affichée/éditée dans Planning EST la semaine réelle en cours,
      // on utilise directement ces données en direct plutôt que l'archive : l'archive n'est mise à
      // jour qu'au clic sur "Sauvegarder", donc une correction (ex. date de fin) faite sans
      // re-sauvegarder l'archive de cette semaine restait invisible pour la Compo jusqu'ici.
      if(planning&&planning.startDateISO===todayMonday){
        setCompoPlanning({...planning,startDateISO:todayMonday});
        setCompoPlanningStatus('ok');
        return;
      }
      const fb=getFirebase();
      if(!fb){if(!cancelled){setCompoPlanning(null);setCompoPlanningStatus('error:Firebase non initialisé');}return;}
      try{
        const ref=fb.doc(fb.db,'planning_archive',todayMonday);
        const snap=await fb.getDoc(ref);
        if(!cancelled){
          if(snap.exists()&&snap.data().planning){setCompoPlanning({...snap.data().planning,startDateISO:todayMonday});setCompoPlanningStatus('ok');}
          else{setCompoPlanning(null);setCompoPlanningStatus('empty:'+todayMonday);} // rien d'archivé pour la semaine en cours : pas de synchro plutôt qu'une synchro fausse
        }
      }catch(e){
        console.error('Chargement du planning de la semaine en cours échoué :',e);
        if(!cancelled){setCompoPlanning(null);setCompoPlanningStatus('error:'+((e&&(e.code||e.message))||'inconnue'));}
      }
    }
    loadCurrentWeekForCompo();
    return ()=>{cancelled=true;};
  },[planning]);

  // Synchronise la liste Compo quand quelqu'un est ajouté/supprimé dans le Planning.
  // Chaque membre ajouté par cette synchro est marqué _fromPlanning directement sur son
  // entrée Compo (plus fiable qu'une liste séparée) : on ne supprime jamais quelqu'un qui
  // n'a pas ce marqueur, donc jamais un membre créé manuellement dans la Compo. Les membres
  // déjà présents avant l'ajout de cette fonctionnalité sont ré-adoptés automatiquement dès
  // qu'ils correspondent à quelqu'un du Planning, ce qui rend le système auto-réparateur.
  // IMPORTANT : ce hook doit rester ici, avant tout "return" conditionnel de App (écran de
  // chargement / connexion), sinon React appelle un nombre de hooks différent selon les
  // rendus et plante (erreur #310).
  useEffect(()=>{
    try{
      if(!hasLoadedStateRef.current)return; // les données réelles (tables/terrasseMode/manual/compos) ne sont pas encore arrivées : ne rien sauvegarder pour ne pas les écraser avec les valeurs par défaut
      if(!compoPlanning||!compoPlanning.team)return;
      const today=dateKey(businessNow());
      // La date de fin d'une personne est un fait indépendant de la semaine affichée dans Planning au
      // moment où elle a été saisie — donc on la relit toujours depuis les données EN DIRECT
      // (planning.team), pas seulement depuis l'archive de "la semaine réelle en cours" qui peut ne
      // pas avoir cette info si cette semaine précise n'a pas été explicitement re-sauvegardée depuis.
      const livePlanningTeamById={};
      (planning&&planning.team||[]).forEach(m=>{livePlanningTeamById[m.id]=m;});
      const mappable={};
      compoPlanning.team.forEach(m=>{
        const live=livePlanningTeamById[m.id];
        const dateDebut=(live&&live.dateDebut!==undefined)?live.dateDebut:m.dateDebut;
        const dateFin=(live&&live.dateFin!==undefined)?live.dateFin:m.dateFin;
        if(dateDebut&&today<dateDebut)return; // pas encore commencé
        if(dateFin&&today>dateFin)return; // date de fin dépassée : plus proposée en Compo (reste dans les archives déjà sauvegardées)
        const compoRole=planningRoleToCompoRole(m.role);
        if(compoRole)mappable[toCompoId(m.id)]={id:toCompoId(m.id),name:m.name,role:compoRole,gender:m.gender||'m'};
      });
      // Tous les ids connus du Planning EN CE MOMENT (archive de la semaine réelle + semaine en direct
      // actuellement affichée, actifs ou non) : permet de retirer un membre Compo déjà marqué
      // _fromPlanning dès qu'il n'apparaît plus nulle part, sans dépendre d'une date de fin qui peut
      // avoir disparu une fois la personne totalement purgée du Planning (ce qui est le comportement
      // voulu là-bas). Les membres jamais marqués _fromPlanning (ajoutés avant ce système) ne peuvent
      // pas être rattachés avec certitude et doivent être retirés à la main une fois, exceptionnellement.
      const allPlanningCompoIds=new Set([
        ...compoPlanning.team.map(m=>toCompoId(m.id)),
        ...(planning&&planning.team||[]).map(m=>toCompoId(m.id)),
      ]);
      const toAdd=Object.keys(mappable).filter(cid=>!team.some(t=>t.id===cid));
      const toRemove=team.filter(t=>!mappable[t.id]&&(t._fromPlanning||allPlanningCompoIds.has(t.id))).map(t=>t.id);
      const toRetag=team.filter(t=>mappable[t.id]&&!t._fromPlanning).map(t=>t.id);
      // Un membre déjà rattaché au Planning dont le genre a changé là-bas (via "Gérer l'équipe du
      // planning") doit se mettre à jour ici aussi, sans qu'il faille le corriger à la main en Compo.
      const toUpdateGender=team.filter(t=>t._fromPlanning&&mappable[t.id]&&mappable[t.id].gender!==(t.gender||'m')).map(t=>t.id);
      if(toAdd.length===0&&toRemove.length===0&&toRetag.length===0&&toUpdateGender.length===0)return;
      let newTeam=team.filter(t=>!toRemove.includes(t.id));
      newTeam=newTeam.map(t=>toRetag.includes(t.id)?{...t,_fromPlanning:true}:t);
      newTeam=newTeam.map(t=>toUpdateGender.includes(t.id)?{...t,gender:mappable[t.id].gender}:t);
      toAdd.forEach(cid=>{newTeam=[...newTeam,{id:cid,name:mappable[cid].name,role:mappable[cid].role,gender:mappable[cid].gender||'m',_fromPlanning:true}];});
      setTeam(newTeam);
      save(services,tables,terrasseMode,manual,currentService,compos,newTeam);
      saveServicesAndTeam(services,newTeam);
    }catch(e){
      console.error('Sync Planning->Compo échouée, ignorée :',e);
    }
  },[compoPlanning&&compoPlanning.team,planning&&planning.team]);

  const save=useCallback((svcList,tbl,ter,man,curSvc,cps,tm)=>{
    try{localStorage.setItem(STORAGE_KEY,JSON.stringify({services:svcList,tables:tbl,terrasseMode:ter,manual:man,currentService:curSvc,compos:cps,team:tm}));}catch(e){}
    const fb=getFirebase();
    if(!fb||authState!=='logged-in')return;
    setSyncStatus('saving');
    if(saveTimerRef.current[curSvc])clearTimeout(saveTimerRef.current[curSvc]);
    saveTimerRef.current[curSvc]=setTimeout(async()=>{
      try{
        const ref=fb.doc(fb.db,'app','state');
        // Écriture ciblée uniquement : services/team ne sont JAMAIS écrits par cette fonction (appelée à
        // chaque modification de table/terrasse/etc.) — seules les actions dédiées "+ Service" et
        // "Supprimer" les modifient, avec une écriture séparée et toujours fraîche. Pas de repli sur un
        // set complet en cas d'échec : un tel repli enverrait une copie locale potentiellement en retard
        // (services, team, ou données d'un autre service) et écraserait silencieusement ce qui a été
        // ajouté ailleurs entre-temps. En cas d'échec, on affiche l'erreur plutôt que d'écrire une
        // valeur périmée : l'utilisateur peut alors réessayer une fois la connexion rétablie.
        const patch={
          ['tables.'+curSvc]: tbl[curSvc],
          ['terrasseMode.'+curSvc]: ter[curSvc]!==undefined?ter[curSvc]:null,
          ['manual.'+curSvc]: man[curSvc]||null,
          ['compos.'+curSvc]: cps[curSvc]||null,
        };
        await fb.updateDoc(ref,patch);
        delete saveTimerRef.current[curSvc];
        setSyncErrorDetail('');
        setSyncStatus('saved');
        setTimeout(()=>setSyncStatus('idle'),2000);
      }catch(e){console.error('Save error',e);setSyncErrorDetail((e&&(e.code||e.message))||'Erreur inconnue (sauvegarde)');setSyncStatus('error');}
    },800);
  },[authState]);

  // Écriture dédiée et toujours fraîche pour services/team — seul point d'entrée qui les modifie
  // désormais (appelé uniquement par + Service / Supprimer un service), avec la valeur tout juste
  // calculée, jamais une copie en mémoire potentiellement en retard.
  async function saveServicesAndTeam(newSvc,newTeam){
    const fb=getFirebase();if(!fb||authState!=='logged-in')return;
    try{
      const ref=fb.doc(fb.db,'app','state');
      await fb.updateDoc(ref,{services:newSvc,team:newTeam});
    }catch(e){

  async function saveSettings(newS,origS){
    const fb=getFirebase();if(!fb)return;
    // Écriture ciblée (dot-notation) sur uniquement les tables/réglages réellement modifiés dans
    // cette session — jamais tout l'objet defaultSettings d'un coup. Sinon, un autre appareil resté
    // ouvert avec une copie plus ancienne écrase silencieusement les modifs faites entre-temps ailleurs
    // (même faille qu'on avait déjà corrigée pour tables/services).
    const o=origS||{};
    const patch={};
    ['defSalle','terSalle','defTerrasse','terTerrasse'].forEach(zone=>{
      const newZone=newS[zone]||{},oldZone=o[zone]||{};
      Object.keys(newZone).forEach(tn=>{
        if(JSON.stringify(newZone[tn])!==JSON.stringify(oldZone[tn])){
          patch['defaultSettings.'+zone+'.'+tn]=newZone[tn];
        }
      });
    });
    if(JSON.stringify(newS.plateauRules)!==JSON.stringify(o.plateauRules)){
      patch['defaultSettings.plateauRules']=newS.plateauRules;
    }
    if(JSON.stringify(newS.gpInventory)!==JSON.stringify(o.gpInventory)){
      patch['defaultSettings.gpInventory']=newS.gpInventory;
    }
    if(Object.keys(patch).length===0)return;
    try{
      const ref=fb.doc(fb.db,'app','state');
      await fb.updateDoc(ref,patch);
    }catch(e){
      console.error(e);
      try{const ref=fb.doc(fb.db,'app','state');await fb.setDoc(ref,{defaultSettings:newS},{merge:true});}
      catch(e2){console.error(e2);}
    }
  }

  function savePlanning(next){
    const fb=getFirebase();if(!fb)return;
    // Accumule les champs modifiés (fusion) au lieu de remplacer le payload en attente à chaque appel :
    // avec un seul minuteur partagé pour tout le Planning, une modif (ex. équipe/genre) suivie d'une
    // autre modif différente (ex. horaire) dans les 800ms écrasait la première sans jamais l'envoyer à
    // Firestore — perte silencieuse. Ici chaque champ reste en attente jusqu'à l'écriture effective.
    planningPendingPatchRef.current={...planningPendingPatchRef.current,...next};
    if(planningSaveTimerRef.current)clearTimeout(planningSaveTimerRef.current);
    planningSaveTimerRef.current=setTimeout(async()=>{
      const toSave=planningPendingPatchRef.current;
      planningPendingPatchRef.current={};
      planningSaveTimerRef.current=null;
      try{
        const ref=fb.doc(fb.db,'app','state');
        const patch={};
        Object.keys(toSave).forEach(k=>{patch['planning.'+k]=toSave[k];});
        await fb.updateDoc(ref,patch);
      }catch(e){
        console.error('Sauvegarde du planning échouée :',e);
        // Pas de repli sur un set complet (risquerait d'écraser avec une copie périmée) : on remet le
        // patch en attente pour qu'il reparte au prochain commit, plutôt que de le perdre.
        planningPendingPatchRef.current={...toSave,...planningPendingPatchRef.current};
      }
    },800);
  }

    {modal&&(<div onClick={e=>{if(e.target===e.currentTarget)setModal(null);}} style={{position:'fixed',inset:0,background:'rgba(0,0,0,.4)',display:'flex',alignItems:'center',justifyContent:'center',zIndex:100}}><div style={{background:'#fff',borderRadius:12,padding:20,width:340,border:'0.5px solid #ddd'}}>

      </div>
    </div></div>)}

    {plateauAlert&&(<div style={{position:'fixed',inset:0,background:'rgba(0,0,0,.4)',display:'flex',alignItems:'center',justifyContent:'center',zIndex:250}}>

    {showSvc&&(<div onClick={e=>{if(e.target===e.currentTarget)setShowSvc(false);}} style={{position:'fixed',inset:0,background:'rgba(0,0,0,.4)',display:'flex',alignItems:'center',justifyContent:'center',zIndex:200}}><div style={{background:'#f5f4f0',borderRadius:12,padding:20,maxWidth:360,width:'90%',maxHeight:'80vh',overflowY:'auto'}}>

      {(()=>{const av=ALL_POSSIBLE.filter(x=>!services.find(s=>s.id===x.id));if(!av.length)return <p style={{color:'#888',fontSize:13,textAlign:'center'}}>Aucun service disponible.</p>;return <div><div style={{fontSize:11,fontWeight:600,color:'#555',marginBottom:6,textTransform:'uppercase',letterSpacing:'.05em'}}>Ajouter</div>{av.map(x=>{const aL=services.find(s=>s.id===x.after)?.label??'';const bL=services.find(s=>s.id===x.before)?.label??'';const pos=aL&&bL?('Entre '+aL+' et '+bL):bL?('Avant '+bL):'En premier';return <button key={x.id} onClick={()=>insertService(x.id,x.label,x.after,x.nextWeek)} style={{display:'block',width:'100%',marginBottom:6,padding:'9px 12px',border:'0.5px solid #ccc',borderRadius:8,background:'#fff',fontSize:13,cursor:'pointer',textAlign:'left',fontWeight:500}}>{x.label}{x.nextWeek?' (semaine suivante)':''}<span style={{fontSize:10,color:'#aaa',display:'block',fontWeight:400}}>{pos}</span></button>;})}</div>;})()}

      <div style={{background:'#f5f4f0',borderRadius:12,padding:20,width:360,maxHeight:'80vh',overflowY:'auto',border:'0.5px solid #ddd'}}>

        {!carcasseArchiveLoading&&carcasseArchive.length===0&&<div style={{textAlign:'center',color:'#aaa',fontSize:13,padding:'20px 0'}}>Aucune sauvegarde.</div>}

          const byMonth={};
          carcasseArchive.forEach(it=>{
            const month=it.date?it.date.slice(0,7):'';
            if(!byMonth[month])byMonth[month]={};
            if(!byMonth[month][it.date])byMonth[month][it.date]=[];
            byMonth[month][it.date].push(it);
          });
          return Object.entries(byMonth).sort((a,b)=>b[0].localeCompare(a[0])).map(([month,byDate])=>{
            const [y,m]=month.split('-');
            const monthLabel=new Date(parseInt(y),parseInt(m)-1,1).toLocaleDateString('fr-FR',{month:'long',year:'numeric'});

              {Object.entries(byDate).sort((a,b)=>b[0].localeCompare(a[0])).map(([date,items])=>{

                      </div>
                    </div>);
                  })}
                </div>);
              })}
            </AccordionMonth>);
          });
        })()}
      </div>
    </div>)}
  </div>);
}

class AppErrorBoundary extends React.Component{
  constructor(p){super(p);this.state={error:null};}
  static getDerivedStateFromError(error){return{error};}
  componentDidCatch(error,info){console.error('Erreur capturée par AppErrorBoundary:',error,info);}
  render(){
    if(this.state.error){
      return <div style={{padding:20,fontFamily:'system-ui,sans-serif',background:'#fff',color:'#1a1a1a',minHeight:'100vh'}}>
        <div style={{fontWeight:700,fontSize:16,color:'#991b1b',marginBottom:10}}>L'application a rencontré une erreur</div>
        <div style={{fontSize:13,color:'#555',marginBottom:14}}>Envoie ce texte tel quel pour que l'erreur puisse être corrigée :</div>
        <pre style={{whiteSpace:'pre-wrap',wordBreak:'break-word',fontSize:12,background:'#f5f4f0',border:'0.5px solid #d4d2c8',borderRadius:8,padding:12}}>{'MESSAGE: '+String(this.state.error&&this.state.error.message||this.state.error)+'\n\nSTACK:\n'+String(this.state.error&&this.state.error.stack||'')}</pre>
        <button onClick={()=>{this.setState({error:null});window.location.reload();}} style={{marginTop:14,padding:'8px 16px',fontSize:13,fontWeight:600,border:'none',borderRadius:8,cursor:'pointer',background:'#1a1a1a',color:'#fff'}}>Recharger</button>
      </div>;
    }
    return this.props.children;
  }
}
ReactDOM.createRoot(document.getElementById('root')).render(<AppErrorBoundary><App/></AppErrorBoundary>);
</script>
</body>
</html>
